name: Publish reviewed platform semantics
on:
  push:
    branches: ['implementation/all-waves']
    paths: ['.github/workflows/mobility-research-source.yml']
permissions:
  contents: write
concurrency:
  group: reviewed-platform-semantics-publication
  cancel-in-progress: false
jobs:
  reviewed-semantics:
    if: github.event_name == 'push' && github.ref == 'refs/heads/implementation/all-waves'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify exact source and reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Repository automation'
          git config user.email 'mobility-automation@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, os, subprocess
          baseline='9b082f013ad711c502a2ee91da638dec19d4591a'
          parts=[f'.github/research-reviewed-{i}.b64' for i in range(3)]
          transport=set(parts+['.github/workflows/mobility-research-source.yml'])
          subprocess.run(['git','merge-base','--is-ancestor',baseline,'HEAD'],check=True)
          changed=set(subprocess.check_output(['git','diff','--name-only','-z',baseline,'HEAD']).decode().strip('\0').split('\0'))
          if changed-transport:
              raise SystemExit('Concurrent source change; publication refused')
          encoded=''.join(Path(part).read_text().strip() for part in parts)
          if len(encoded)!=47216:
              raise SystemExit('Unexpected reviewed patch length')
          packed=base64.b64decode(encoded,validate=True)
          if hashlib.sha256(packed).hexdigest()!='517294f59e80eb6f052c8b49c5c65cf6291237775b72b89bb7e6186537c83fd2':
              raise SystemExit('Reviewed patch transport checksum mismatch')
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch=decoder.decompress(packed,max_length=1024*1024)
          if not decoder.eof or decoder.unused_data or len(patch)!=164080:
              raise SystemExit('Unexpected decompressed patch')
          if hashlib.sha256(patch).hexdigest()!='779f0a8b5e5c10b9c7e81d27c3779803204d70f266c05106257e0639d573dad3':
              raise SystemExit('Reviewed implementation checksum mismatch')
          path=Path(os.environ['RUNNER_TEMP'])/'reviewed-semantics.patch'
          path.write_bytes(patch)
          subprocess.run(['git','-c','core.hooksPath=/dev/null','am',str(path)],check=True)
          PY
      - name: Install repository integration and packaging dependencies
        run: python -m pip install -r requirements-repository.txt -e '.[controlplane]' 'setuptools>=80,<85' 'wheel>=0.45,<1'
      - name: Regenerate disabled reviewed examples
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          from provisioner.domain.request import digest
          from tests.provisioning import support
          root=Path.cwd()
          def write(path, doc):
              compact=len(path.read_text().splitlines())==1
              options={'separators':(',',':')} if compact else {'indent':2}
              path.write_text(json.dumps(doc,sort_keys=True,**options)+'\n')
          def fingerprints(plan):
              assert plan.native_contact is False
              return {'request_digest':plan.request.digest,'plan_digest':plan.digest,
                  'manifest_digest':plan.manifest_digest,'resolution_digest':digest(plan.resolution.to_dict()),
                  'placement_digest':plan.decision.digest,'desired_state_digest':plan.desired_state.digest,
                  'environment_digest':digest(plan.environment),'conformance_digest':digest(plan.conformance),
                  'compiled_files':sorted(plan.compiled),'status':plan.status,'native_contact':plan.native_contact}
          path=root/'examples/golden/digests.json'
          index=json.loads(path.read_text())
          for name in support.REFERENCE_REQUESTS:
              plan=support.reference_plan(name)
              target=root/f'examples/resolved/{name}.resolution.json'
              doc=json.loads(target.read_text())
              for key,value in plan.resolution.to_dict().items():
                  if key not in {'format','limits'}:
                      doc[key]=value
              doc['limits']=list(dict.fromkeys(doc['limits']+list(plan.resolution.limits)))
              doc['request_digest']=plan.request.digest
              doc['policy']=dict(plan.policy)
              write(target,doc)
              for suffix,doc in [('placement',plan.decision.to_dict()),('desired-state',plan.desired_state.to_dict())]:
                  write(root/f'examples/resolved/{name}.{suffix}.json',doc)
              for suffix,doc in [('environment',plan.environment),('conformance',plan.conformance)]:
                  write(root/f'examples/golden/{name}.{suffix}.json',doc)
              index['subjects'][name].update(fingerprints(plan))
          catalog=support.catalogs()
          catalog_ref={'versions':catalog.versions,'digest':catalog.digest}
          index['catalogs']=catalog_ref
          write(path,index)
          path=root/'examples/golden/cross-platform.digests.json'
          index=json.loads(path.read_text())
          index['catalogs']=catalog_ref
          for name,row in index['requests'].items():
              for platform,cell in row['platforms'].items():
                  plan=support.platform_plan(platform,name)
                  cell.update({k:v for k,v in fingerprints(plan).items() if k in cell})
                  cell['realization_gaps']=sorted(w['code'] for w in plan.warnings)
          write(path,index)
          PY
          git add examples/golden examples/resolved
          git -c core.hooksPath=/dev/null commit -m 'test(profiles): refresh disabled examples for semantic requirements'
      - name: Verify exact reviewed deliverable and isolate it from publication transport
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          env=dict(os.environ,GIT_INDEX_FILE=str(Path(os.environ['RUNNER_TEMP'])/'delivery-index'))
          subprocess.run(['git','read-tree','HEAD'],env=env,check=True)
          subprocess.run(['git','update-index','--force-remove',*[f'.github/research-reviewed-{i}.b64' for i in range(3)],'.github/workflows/mobility-research-source.yml'],env=env,check=True)
          actual=subprocess.check_output(['git','write-tree'],env=env).decode().strip()
          if actual!='d45b87d3ab0908c2067c52fbc638e0f80e7abee7':
              raise SystemExit('Reviewed delivery tree mismatch: '+actual)
          candidate=subprocess.check_output(['git','commit-tree',actual,'-p','HEAD','-m','Temporary exact-tree validation candidate']).decode().strip()
          destination=str(Path(os.environ['RUNNER_TEMP'])/'capability-delivery')
          subprocess.run(['git','worktree','add','--detach',destination,candidate],check=True)
          print('Exact reviewed source tree verified:',actual)
          PY
      - name: Test the transport-free deliverable without weakening repository checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/capability-delivery"
          python -m pip install -e '.[controlplane]'
          python -m unittest discover -s tests/provisioning/policy -p 'test_*.py'
          python -m unittest discover -s tests/provisioning/placement -p 'test_*.py'
          python -m unittest discover -s tests/provisioning/discovery -p 'test_*.py'
          python -m unittest discover -s tests/provisioning/unit -p 'test_*.py'
          python -m unittest tests.provisioning.end_to_end.test_golden tests.provisioning.documentation.test_documentation tests.provisioning.documentation.test_research_alignment tests.test_retired_interfaces
          python scripts/check_documentation.py
          python scripts/check_repository.py
          python scripts/check_retired_interfaces.py
          python scripts/check_installed_distribution.py
      - name: Publish implementation commits only by ordinary fast-forward
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          git push origin HEAD:refs/heads/implementation/all-waves
          git log -5 --format='%h %s'
