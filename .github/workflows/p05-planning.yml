name: P05 planning
on:
  push:
    branches: [main, greenfield/enterprise-microservices-plan]
    paths: ['services/planning/**', 'services/lifecycle/**', 'services/inventory/**', 'services/governance/**', 'services/catalogue/**', 'services/assurance/**', 'apps/console/**', 'contracts/**', 'scripts/p05/**', '.github/workflows/p05-planning.yml']
  pull_request:
    branches: [main, greenfield/enterprise-microservices-plan]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    name: P05 PostgreSQL plan and reservation integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.19'
          enable-cache: false
      - name: Verify Inventory producer / installed Planning owner contract stays in sync
        run: python scripts/p05/sync_migration_inputs.py --check
      - name: Validate actual Inventory field producer against packaged Planning contract
        run: uv run --project services/planning --frozen pytest -q services/planning/tests/test_migration_owner_contract.py
      - name: Verify native security API feature registry matches provider resolvers
        run: python scripts/verify_native_security_api.py
      - name: Exercise exact scope, canonical plans, PostgreSQL races and independent simulated allocations
        env:
          P05_POSTGRES_BIN: /usr/lib/postgresql/16/bin
        run: python scripts/p05/qualify.py --output "$RUNNER_TEMP/p05-core"
      - name: Retain source-bound observations including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p05-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p05-core/
          if-no-files-found: error
          retention-days: 14

  live:
    name: P05 live discovery, Console and delivery (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      P05_BROWSER_ENGINE: ${{ matrix.browser }}
    services:
      postgres:
        image: postgres@sha256:9e73daeb439141c2b11eea2463f5f1a3b269fd90d897b41cddb7cb440f21aa5d
        env:
          POSTGRES_PASSWORD: synthetic-p05-disposable-postgres
          POSTGRES_DB: p05_live_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.11'
          extensions: ctype, curl, dom, fileinfo, mbstring, openssl, pdo, pdo_pgsql, pdo_sqlite, sockets, tokenizer, xml, xmlwriter
          coverage: none
          tools: composer:2.10.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.19'
          enable-cache: false
      - name: Install independent locked applications
        run: |
          for component in services/governance services/catalogue services/assurance apps/console; do
            mkdir -p "$component/bootstrap/cache" "$component/storage/framework/"{cache,sessions,views} "$component/storage/logs"
            touch "$component/.env"
            composer install --working-dir="$component" --no-scripts --no-interaction --prefer-dist --no-progress
          done
          uv sync --project services/planning --locked
          uv sync --project services/inventory --locked
          uv sync --project workers/inventory --locked
          npm ci --prefix apps/console --ignore-scripts --no-audit --no-fund
          npm run build --prefix apps/console
          cd apps/console
          npx playwright install --with-deps "${P05_BROWSER_ENGINE}"
      - name: Verify signed qualification custody without asserting native support
        run: python -m unittest discover -s tests/contracts -p test_native_qualification.py -v
      - name: Exercise PostgreSQL, native fixture pagination, live TLS authority, broker replay and compiled browser journeys
        env:
          P05_TEST_POSTGRES: '1'
          P05_ADMIN_PASSWORD: synthetic-p05-disposable-postgres
          P05_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: uv run --project scripts/p01/contracts --frozen python scripts/p05/verify_live.py --output "$RUNNER_TEMP/p05-live"
      - name: Retain redacted exact-source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p05-live-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p05-live/
          if-no-files-found: error
          retention-days: 14
