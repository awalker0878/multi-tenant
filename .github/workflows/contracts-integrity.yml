name: Contract source and consumer integrity
on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'services/**'
      - 'workers/**'
      - 'apps/console/**'
      - 'architecture/contract-consumers.json'
      - 'architecture/retired-contract-releases.json'
      - 'architecture/retirement-unverified-baseline.txt'
      - 'architecture/retirement-clearances.json'
      - 'architecture/installed-contract-usage.json'
      - 'scripts/contracts/**'
      - 'scripts/p01/contracts/**'
      - 'scripts/p03/**'
      - 'scripts/p04/**'
      - 'scripts/p05/**'
      - 'scripts/p06/**'
      - 'scripts/p07/**'
      - 'scripts/p08/**'
      - 'scripts/p09/**'
      - 'tests/contracts/**'
      - '.github/workflows/contracts-integrity.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Install pinned contract validators
        run: python -m pip install --disable-pip-version-check -r scripts/contracts/requirements.txt
      - name: Reject unrecorded Git-baseline canonical deletion
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            CONTRACT_BASE=$(git merge-base "$EVENT_BASE" "$EVENT_HEAD")
          elif [ -n "$EVENT_BASE" ] && [ "$EVENT_BASE" != 0000000000000000000000000000000000000000 ]; then
            CONTRACT_BASE="$EVENT_BASE"
          else
            CONTRACT_BASE=$(git rev-parse HEAD^)
          fi
          python scripts/p01/contracts/compatibility.py --base "$CONTRACT_BASE"
      - name: Check canonical embedded readiness projection
        run: python scripts/contracts/generate_readiness.py
      - name: Reject stale executable dependencies on retired canonical contracts
        run: python scripts/contracts/retirement_integrity.py
      - name: Check generated owner authority response projections
        run: python scripts/contracts/generate_authority_releases.py --check
      - name: Check assembled contract bundles
        run: python scripts/contracts/build.py --check
      - name: Rebuild generated active consumer copies without rewriting sources
        run: |
          python scripts/p03/generate_clients.py --check
          python scripts/p04/generate_clients.py --check
          python scripts/p06/generate_contracts.py --check
      - name: Check wire versions, schemas, route parity and consumer drift
        run: python scripts/contracts/check.py
      - name: Validate independent inventory, negative drift and API route canaries
        run: |
          python -m unittest discover -s tests/contracts -p 'test_integrity.py' -v
          python -m unittest discover -s tests/contracts -p 'test_route_conformance.py' -v
          python -m unittest discover -s tests/contracts -p 'test_assurance.py' -v
      - name: Install bounded owner contract test dependencies
        run: python -m pip install --disable-pip-version-check -e services/planning -e services/lifecycle -e services/inventory pytest==9.1.1
      - name: Probe Inventory and Planning migration operations against real ASGI routers
        env:
          PYTHONPATH: services/inventory/src:services/planning/src:services/lifecycle/src
        run: |
          python scripts/contracts/route_conformance.py --app inventory
          python scripts/contracts/route_conformance.py --app planning-migration
          python scripts/contracts/route_conformance.py --app python-composed
          python scripts/contracts/route_conformance.py --app lifecycle-native
          python scripts/contracts/route_conformance.py --app planning-immutable
          python scripts/contracts/route_conformance.py --app planning-lifecycle
          mkdir -p "$RUNNER_TEMP/contract-assurance"
          python scripts/contracts/assurance_routes.py --app inventory --output "$RUNNER_TEMP/contract-assurance/python-inventory.json"
          python scripts/contracts/assurance_routes.py --app python-composed --output "$RUNNER_TEMP/contract-assurance/python-composed.json"
          python scripts/contracts/assurance_routes.py --app lifecycle-native --output "$RUNNER_TEMP/contract-assurance/python-native.json"
          python scripts/contracts/assurance_routes.py --app planning-immutable --producer-only --output "$RUNNER_TEMP/contract-assurance/python-immutable-producers.json"
          python scripts/contracts/assurance_routes.py --app planning-lifecycle --producer-only --output "$RUNNER_TEMP/contract-assurance/python-lifecycle-producers.json"
          python scripts/contracts/python_denials.py --owner inventory --output "$RUNNER_TEMP/contract-assurance/python-inventory-denials.json"
          python scripts/contracts/python_denials.py --owner planning --output "$RUNNER_TEMP/contract-assurance/python-planning-denials.json"
          python scripts/contracts/python_denials.py --owner lifecycle --output "$RUNNER_TEMP/contract-assurance/python-lifecycle-denials.json"
      - name: Retain SHA-bound Python route evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: contract-assurance-python-${{ github.sha }}
          path: ${{ runner.temp }}/contract-assurance/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Validate real Planning and Lifecycle readiness producers and consumers
        env:
          PYTHONPATH: services/planning/src:services/lifecycle/src:services/inventory/src:services/planning/tests
        run: python -m pytest --import-mode=importlib -q services/inventory/tests/test_migration_collection_coverage.py services/inventory/tests/test_migration_collection_evidence.py services/planning/tests/test_migration_readiness.py services/planning/tests/test_migration_owner_contract.py tests/contracts/test_inventory_planning_contract.py services/planning/tests/test_owner_operation_contracts.py services/planning/tests/test_planning_lifecycle_producer_contract.py services/planning/tests/test_migration_flows_http.py services/planning/tests/test_migration_api_selection.py services/lifecycle/tests/test_migration_readiness.py services/lifecycle/tests/test_native_owners.py services/planning/tests/test_migration_support.py
      - name: Verify executable Inventory/Catalogue/Assurance consumer boundaries
        run: python scripts/contracts/measured_consumers.py --output "$RUNNER_TEMP/contract-assurance-consumers.json"
      - name: Retain measured producer-consumer validation receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: contract-assurance-consumers-${{ github.sha }}
          path: ${{ runner.temp }}/contract-assurance-consumers.json
          if-no-files-found: warn
          retention-days: 14

  laravel-runtime-routes:
    name: Live Laravel routes / OpenAPI (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [governance, catalogue, assurance]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.11'
          extensions: ctype, curl, dom, fileinfo, mbstring, openssl, pdo, pdo_pgsql, sockets, tokenizer, xml, xmlwriter
          coverage: none
          tools: composer:2.10.3
      - name: Install isolated application from its lockfile
        run: |
          mkdir -p services/${{ matrix.app }}/bootstrap/cache services/${{ matrix.app }}/storage/framework/{cache,sessions,views} services/${{ matrix.app }}/storage/logs
          touch services/${{ matrix.app }}/.env
          composer install --working-dir=services/${{ matrix.app }} --no-dev --no-plugins --no-scripts --no-interaction --no-progress --prefer-dist
      - name: Verify Governance approval 409 producer behavior
        if: matrix.app == 'governance'
        run: php scripts/contracts/verify_governance_approval_status.php
      - name: Compare the deployed router with every owned active OpenAPI release
        run: |
          php services/${{ matrix.app }}/artisan route:list --json > "$RUNNER_TEMP/laravel-routes.json"
          python scripts/contracts/route_conformance.py --app "${{ matrix.app }}" --routes "$RUNNER_TEMP/laravel-routes.json"
          python scripts/contracts/assurance_routes.py --app "${{ matrix.app }}" --routes "$RUNNER_TEMP/laravel-routes.json" --output "$RUNNER_TEMP/${{ matrix.app }}-routes.json"
      - name: Probe missing credentials on every published secured Laravel operation
        run: php scripts/contracts/laravel_denials.php "${{ matrix.app }}" "$RUNNER_TEMP/${{ matrix.app }}-denials.json"
      - name: Retain measured Laravel route and denial evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: contract-assurance-${{ matrix.app }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/${{ matrix.app }}-routes.json
            ${{ runner.temp }}/${{ matrix.app }}-denials.json
          if-no-files-found: warn
          retention-days: 14


  assurance-report:
    name: Operation-level contract assurance report
    if: always()
    needs: [integrity, laravel-runtime-routes]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Install pinned validators for canonical coverage
        run: python -m pip install --disable-pip-version-check -r scripts/contracts/requirements.txt
      - name: Download execution evidence from the same workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: contract-assurance-*-${{ github.sha }}
          path: ${{ runner.temp }}/measured
          merge-multiple: true
      - name: Generate and retain operation-by-operation assurance findings
        run: |
          python scripts/contracts/combine_assurance.py --input-directory "$RUNNER_TEMP/measured" --output "$RUNNER_TEMP/contract-assurance-report.json" --require-qualified
      - name: Upload source-specific assurance report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: contract-assurance-report-${{ github.sha }}
          path: ${{ runner.temp }}/contract-assurance-report.json
          if-no-files-found: warn
          retention-days: 30
