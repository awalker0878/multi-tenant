name: Prepare reviewed completion-audit correction
on:
  push:
    branches: [fix/completion-audit]
    paths: ['.audit-apply.py', '.audit-payload-*.b64', '.github/workflows/audit-prepare.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/fix/completion-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install reviewed document and local-test dependencies
        run: python -m pip install -r requirements-repository.txt -r requirements-dev.txt
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - name: Apply only the checksum-bound reviewed source delta
        run: python .audit-apply.py
      - name: Actual backend-disabled validation and mocked module plans
        run: python tools/verify_terraform.py --mock-tests
      - name: Retain actual generated provider locks, not invented checksums
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path.cwd()
          for family in ('modules','roots'):
              for source in (root/'terraform'/family).glob('*/main.tf.json'):
                  lock=root/'build/reports/toolchain-locks'/family/source.parent.name/'.terraform.lock.hcl'
                  assert lock.is_file(),str(lock)
                  shutil.copy2(lock,source.parent/lock.name)
          PY
          python scripts/check_dependency_locks.py
      - name: Actual Ansible syntax, staging, idempotence and negative cases
        run: python scripts/verify_ansible.py
      - name: Exact documentation, source and local regression checks
        run: |
          python scripts/check_documentation.py
          python scripts/check_repository.py
          python tools/check_local.py
          python scripts/record_audit_ci_evidence.py
          python scripts/write_release_manifest.py
          python tools/check_release.py
          git diff --check
      - name: Publish readable corrected source only to the authorized correction branch
        env:
          PUBLISH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,os,subprocess
          assert os.environ['GITHUB_REF']=='refs/heads/fix/completion-audit'
          env=os.environ.copy()
          token=env.pop('PUBLISH_TOKEN')
          env['GIT_CONFIG_COUNT']='1'
          env['GIT_CONFIG_KEY_0']='http.https://github.com/.extraheader'
          env['GIT_CONFIG_VALUE_0']='AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+token).encode()).decode()
          env['GIT_TERMINAL_PROMPT']='0'
          def run(*args):return subprocess.check_output(['git',*args],env=env,text=True).strip()
          remote=run('ls-remote','origin','refs/heads/fix/completion-audit').split()[0]
          assert remote==os.environ['GITHUB_SHA'],'Correction branch moved; refusing publication'
          run('config','user.name','github-actions[bot]')
          run('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          run('config','core.hooksPath','/dev/null')
          run('add','--all','--','.')
          run('diff','--cached','--check')
          run('commit','-m','Fix completion audit fidelity, ADR governance, assurance allocation and verified engine locks')
          run('push','origin','HEAD:refs/heads/fix/completion-audit')
          print('Published tested correction branch commit',run('rev-parse','HEAD'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: completion-audit-preparation-evidence
          path: build/reports/
          retention-days: 14
          if-no-files-found: warn
