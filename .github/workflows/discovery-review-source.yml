name: Discovery source review
on:
  push:
    branches: ['implementation/all-waves']
    paths: ['.github/workflows/discovery-review-source.yml']
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked source without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/discovery-review"
          git rev-parse HEAD > "$RUNNER_TEMP/discovery-review/revision.txt"
          git bundle create "$RUNNER_TEMP/discovery-review/source.bundle" HEAD
          (cd "$RUNNER_TEMP/discovery-review" && sha256sum source.bundle > source.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: discovery-review-${{ github.sha }}
          path: ${{ runner.temp }}/discovery-review/
          retention-days: 1
          if-no-files-found: error
