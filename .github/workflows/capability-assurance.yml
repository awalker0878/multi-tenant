name: Capability runtime assurance
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: capability-assurance-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        product: [services/planning, services/inventory, services/lifecycle, workers/lifecycle]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.19'
          enable-cache: false
      - name: Install locked product dependencies
        working-directory: ${{ matrix.product }}
        run: uv sync --locked
      - name: Check formatting and lint with reviewable differences
        working-directory: ${{ matrix.product }}
        run: |
          uv run --frozen ruff format --check --diff .
      - name: Check lint
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.product }}
        run: uv run --frozen ruff check --output-format concise .
      - name: Check strict types
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.product }}
        run: uv run --frozen mypy
      - name: Test product boundaries with PostgreSQL available
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.product }}
        env:
          P05_POSTGRES_BIN: /usr/lib/postgresql/16/bin
          P06_POSTGRES_BIN: /usr/lib/postgresql/16/bin
          P04_POSTGRES_BIN: /usr/lib/postgresql/16/bin
          P08_POSTGRES_BIN: /usr/lib/postgresql/16/bin
        run: uv run --frozen pytest -q
