# Candidate for official Temporal Helm chart 1.6.0 (server 1.32.0).
# Replace example DNS names and pre-create the database/mTLS Secrets. Render
# against the pinned chart before use; production qualification is pending.
server:
  image:
    repository: temporalio/server
    tag: 1.32.0
  frontend:
    service:
      type: ClusterIP
    ingress:
      enabled: false
  internal-frontend:
    enabled: false
  tls:
    internode:
      enabled: true
      secretName: temporal-internode-tls
      requireClientAuth: true
      serverName: temporal-internode.management.svc.cluster.local
    frontend:
      enabled: true
      secretName: temporal-frontend-tls
      requireClientAuth: true
      serverName: temporal-frontend.management.svc.cluster.local
  config:
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 512
      datastores:
        default:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            connectAddr: postgres.management.svc.cluster.local:5432
            connectProtocol: tcp
            user: temporal_history
            existingSecret: temporal-history-db
            secretKey: password
            tls:
              enabled: true
        visibility:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal_visibility
            connectAddr: postgres.management.svc.cluster.local:5432
            connectProtocol: tcp
            user: temporal_visibility
            existingSecret: temporal-visibility-db
            secretKey: password
            tls:
              enabled: true
    namespaces:
      create: true
      namespace:
        - name: mobility-management
          retention: 3d
web:
  enabled: false
admintools:
  enabled: false
