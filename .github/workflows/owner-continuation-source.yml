name: Owner review continuation source
on:
  push:
    branches: ['implementation/all-waves']
    paths: ['.github/workflows/owner-continuation-source.yml']
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'awalker0878/multi-tenant'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact tracked source without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-source"
          git rev-parse HEAD > "$RUNNER_TEMP/review-source/revision.txt"
          git bundle create "$RUNNER_TEMP/review-source/source.bundle" HEAD
          cd "$RUNNER_TEMP/review-source"
          sha256sum source.bundle > source.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-continuation-source-${{ github.sha }}
          path: ${{ runner.temp }}/review-source/
          retention-days: 1
          if-no-files-found: error
