name: Architecture and automation validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install runtime and wheel build dependencies
        run: python -m pip install -r requirements-repository.txt '.[controlplane]' 'setuptools>=80,<85' 'wheel>=0.45,<1'
      - name: Build and exercise the installed wheel outside the checkout
        run: python scripts/check_installed_distribution.py
  controlplane:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_migration_only
          POSTGRES_DB: hosting_controlplane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hosting_controlplane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HOSTING_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:ci_migration_only@localhost:5432/hosting_controlplane_test
      HOSTING_TEST_POSTGRES_MIGRATION_DSN: postgresql://hosting_migration_owner:ci_owner_only@localhost:5432/hosting_controlplane_test
      HOSTING_TEST_POSTGRES_RUNTIME_DSN: postgresql://hosting_runtime:ci_runtime_only@localhost:5432/hosting_controlplane_test
      HOSTING_TEST_POSTGRES_AUTHORITY_DSN: postgresql://hosting_authority:ci_authority_only@localhost:5432/hosting_controlplane_test
      HOSTING_TEST_POSTGRES_ENROLLMENT_DSN: postgresql://hosting_enrollment:ci_enrollment_only@localhost:5432/hosting_controlplane_test
      HOSTING_TEST_POSTGRES_DIRECTORY_RESOLVER_DSN: postgresql://hosting_directory_resolver:ci_directory_resolver_only@localhost:5432/hosting_controlplane_test
      HOSTING_TEST_POSTGRES_DIRECTORY_WRITER_DSN: postgresql://hosting_directory_writer:ci_directory_writer_only@localhost:5432/hosting_controlplane_test
      HOSTING_TEST_POSTGRES_SITE_WORKER_DSN: postgresql://hosting_site_worker:ci_site_worker_only@localhost:5432/hosting_controlplane_test
      HOSTING_TEST_POSTGRES_DISCOVERY_DSN: postgresql://hosting_discovery_ingest:ci_discovery_only@localhost:5432/hosting_controlplane_test
      HOSTING_TEST_POSTGRES_ASSESSMENT_DSN: postgresql://hosting_assessment_ingest:ci_assessment_only@localhost:5432/hosting_controlplane_test
      HOSTING_TEST_POSTGRES_DSN: postgresql://postgres:ci_migration_only@localhost:5432/hosting_controlplane_test
      HOSTING_TEST_POSTGRES_MONITOR_DSN: postgresql://hosting_discovery_monitor:ci_monitor_only@localhost:5432/hosting_controlplane_test
      HOSTING_TEST_POSTGRES_ISOLATED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install control-plane dependencies
        run: python -m pip install -r requirements-repository.txt -e '.[controlplane]' 'httpx==0.28.1'
      - name: Prepare disposable PostgreSQL roles and migrations
        run: python -m tests.provisioning.controlplane.prepare_postgres
      - name: Run control-plane database and HTTP integration tests
        run: |
          # Keep separate interpreters and report every tenant-isolated suite.
          # Any failed suite still fails this step and blocks subsequent gates.
          integration_status=0
          for suite in controlplane discovery authority jobs api worker reconciliation mobility operations conversion evidence workflow; do
            python -m unittest discover -s "tests/provisioning/$suite" -p 'test_*.py' -v || integration_status=1
          done
          exit "$integration_status"
      - name: Validate the packaged portal browser flow
        run: |
          node --check provisioner/controlplane/api/portal/app.js
          node --test tests/provisioning/api/test_portal_ui.js
      - name: Restore control-plane state into an observation-only database
        run: python -m tests.provisioning.controlplane.restore_gate
  temporal_recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_migration_only
          POSTGRES_DB: hosting_controlplane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hosting_controlplane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEMPORAL_TEST_DB_PASSWORD: ci_disposable_temporal_only
      HOSTING_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:ci_migration_only@localhost:5432/hosting_controlplane_test
      HOSTING_TEST_POSTGRES_MIGRATION_DSN: postgresql://hosting_migration_owner:ci_owner_only@localhost:5432/hosting_controlplane_test
      HOSTING_TEST_POSTGRES_RUNTIME_DSN: postgresql://hosting_runtime:ci_runtime_only@localhost:5432/hosting_controlplane_test
      HOSTING_TEST_POSTGRES_AUTHORITY_DSN: postgresql://hosting_authority:ci_authority_only@localhost:5432/hosting_controlplane_test
      HOSTING_TEST_POSTGRES_ENROLLMENT_DSN: postgresql://hosting_enrollment:ci_enrollment_only@localhost:5432/hosting_controlplane_test
      HOSTING_TEST_POSTGRES_DIRECTORY_RESOLVER_DSN: postgresql://hosting_directory_resolver:ci_directory_resolver_only@localhost:5432/hosting_controlplane_test
      HOSTING_TEST_POSTGRES_DIRECTORY_WRITER_DSN: postgresql://hosting_directory_writer:ci_directory_writer_only@localhost:5432/hosting_controlplane_test
      HOSTING_TEST_POSTGRES_MONITOR_DSN: postgresql://hosting_discovery_monitor:ci_monitor_only@localhost:5432/hosting_controlplane_test
      HOSTING_TEST_POSTGRES_ISOLATED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned Temporal client and workflow dependencies
        run: python -m pip install -e '.[controlplane]'
      - name: Prepare disposable product PostgreSQL roles and migrations
        run: python -m tests.provisioning.controlplane.prepare_postgres
      - name: Start disposable self-hosted Temporal on PostgreSQL
        run: docker compose -f deploy/temporal/compose.integration.yml up -d
      - name: Persist a pending workflow without a worker
        run: python -m tests.provisioning.workflow.temporal_recovery_gate prepare --state /tmp/temporal-recovery.json
      - name: Commit a product job and start Temporal before its outbox ACK
        run: python -m tests.provisioning.workflow.postgres_temporal_gate prepare --state /tmp/postgres-temporal.json
      - name: Restart Temporal while retaining its database
        run: docker compose -f deploy/temporal/compose.integration.yml restart temporal
      - name: Recover the same run and replay its history
        run: python -m tests.provisioning.workflow.temporal_recovery_gate recover --state /tmp/temporal-recovery.json
      - name: Reconcile the product outbox and pin the original Temporal run
        run: python -m tests.provisioning.workflow.postgres_temporal_gate recover --state /tmp/postgres-temporal.json
      - name: Route pinned approvals through Worker upgrade and rollback
        run: python -m tests.provisioning.workflow.worker_version_gate
      - name: Show service logs after a failure
        if: failure()
        run: docker compose -f deploy/temporal/compose.integration.yml logs --tail=160
      - name: Remove the disposable service and its database
        if: always()
        run: docker compose -f deploy/temporal/compose.integration.yml down -v
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Confirm current checkout integrity before generated reports
        run: python -m provisioner.execution.source_integrity
      - name: Install repository and local protocol-test dependencies
        run: python -m pip install -r requirements-repository.txt -e '.[controlplane]' 'httpx==0.28.1'
      - name: Repository hygiene and frozen-artifact links
        run: python scripts/check_repository.py
      - name: Markdown source coverage, diagrams, forms, anchors and ADR traceability
        run: python scripts/check_documentation.py
      - name: Retired interface register rejects reintroduced legacy paths, commands and schemas
        run: python scripts/check_retired_interfaces.py > build/reports/retired_interfaces.json
      - name: Native reference planning inputs and original W14 associations
        run: python scripts/commissioning_pack.py check > build/reports/native_reference_planning.json
      - name: Current exact-tuple version, source provenance and lifecycle records
        run: python -m provisioner.qualification.provenance --as-of 2026-09-18T22:00:00Z > build/reports/version_source_provenance.json
      - name: Version/source readiness must remain held without a selected supported tuple
        run: python scripts/check_version_source_readiness.py examples/version_source_readiness_intent.json.example --as-of 2026-09-18T22:00:00Z --expected-status HOLD_NO_CURRENT_VERSION_SOURCE_PROVENANCE > build/reports/version_source_readiness.json
      - name: Current exact-tuple native qualification dossiers
        run: python -m provisioner.qualification.native > build/reports/platform_native_qualification.json
      - name: Platform capability registry evidence boundary
        run: python -m provisioner.qualification.registry > build/reports/platform_capability_registry.json
      - name: Platform-family pre-placement must remain held without native qualification
        run: python scripts/check_platform_family_eligibility.py examples/pre_placement_capability_request.json.example --expected-status HOLD_NO_NATIVE_QUALIFIED_PLATFORM > build/reports/platform_family_eligibility.json
      - name: Current site cell and service-class capacity envelopes
        run: python -m provisioner.allocations.capacity_evidence > build/reports/site_service_capacity_index.json
      - name: Site service-capacity precheck must remain held without commissioned envelopes
        run: python -m provisioner.allocations.site_eligibility examples/site_service_capacity_request.json.example --expected-status HOLD_NO_ELIGIBLE_SITE_SERVICE_ENVELOPE > build/reports/site_service_capacity_eligibility.json
      - name: Exported reservation records remain external-authority evidence
        run: python -m provisioner.allocations.reservation_evidence --as-of 2026-09-18T18:00:00Z > build/reports/reservation_records.json
      - name: Reservation preflight must remain held without eligible envelope
        run: python -m provisioner.allocations.reservation_preflight examples/reservation_intent.json.example --as-of 2026-09-18T18:00:00Z --expected-status HOLD_ENVELOPE_NOT_CURRENTLY_ELIGIBLE > build/reports/reservation_preflight.json
      - name: Exported IPAM allocations remain authoritative-service evidence
        run: python -m provisioner.allocations.ipam_evidence --as-of 2026-09-18T18:00:00Z > build/reports/ipam_allocation_records.json
      - name: IPAM allocation preflight must remain held without parent reservation
        run: python -m provisioner.allocations.ipam_preflight examples/ipam_allocation_intent.json.example --as-of 2026-09-18T18:00:00Z --expected-status HOLD_PARENT_RESERVATION_NOT_HELD > build/reports/ipam_allocation_preflight.json
      - name: Exported DNS registrations remain authoritative-service evidence
        run: python -m provisioner.allocations.dns_evidence --as-of 2026-09-18T18:00:00Z > build/reports/dns_registration_records.json
      - name: DNS registration preflight must remain held without confirmed IPAM
        run: python -m provisioner.allocations.dns_preflight examples/dns_registration_intent.json.example --as-of 2026-09-18T18:00:00Z --expected-status HOLD_IPAM_ALLOCATION_NOT_CONFIRMED > build/reports/dns_registration_preflight.json
      - name: Exported backup/restore assurance remains external-service evidence
        run: python scripts/check_backup_restore_assurance.py --as-of 2026-09-18T19:00:00Z > build/reports/backup_restore_assurance.json
      - name: Backup/restore readiness must remain held without current assurance
        run: python scripts/check_backup_restore_readiness.py examples/backup_restore_readiness_intent.json.example --as-of 2026-09-18T19:00:00Z --expected-status HOLD_NO_CURRENT_BACKUP_ASSURANCE > build/reports/backup_restore_readiness.json
      - name: Exported control inheritance assurance remains external-authority evidence
        run: python scripts/check_control_inheritance_assurance.py --as-of 2026-09-18T20:00:00Z > build/reports/control_inheritance_assurance.json
      - name: Control inheritance readiness must remain held without current allocation
        run: python scripts/check_control_inheritance_readiness.py examples/control_inheritance_readiness_intent.json.example --as-of 2026-09-18T20:00:00Z --expected-status HOLD_NO_CURRENT_CONTROL_ALLOCATION > build/reports/control_inheritance_readiness.json
      - name: Exported operational handover assurance remains external-operations evidence
        run: python scripts/check_operational_handover_assurance.py --as-of 2026-09-18T21:00:00Z > build/reports/operational_handover_assurance.json
      - name: Operational handover readiness must remain held without current acceptance
        run: python scripts/check_operational_handover_readiness.py examples/operational_handover_readiness_intent.json.example --as-of 2026-09-18T21:00:00Z --expected-status HOLD_NO_CURRENT_OPERATIONAL_HANDOVER > build/reports/operational_handover_readiness.json
      - name: Exported bounded extension adoption remains extension-only evidence
        run: python scripts/check_extension_adoption_assurance.py --as-of 2026-09-18T21:00:00Z > build/reports/extension_adoption_assurance.json
      - name: Extension readiness must remain held without adopted extension scope
        run: python scripts/check_extension_adoption_readiness.py examples/extension_adoption_readiness_intent.json.example --as-of 2026-09-18T21:00:00Z --expected-status HOLD_NO_CURRENT_EXTENSION_ADOPTION > build/reports/extension_adoption_readiness.json
      - name: Knowledge-home and release-maintenance evidence remains non-authoritative
        run: python scripts/check_knowledge_maintenance_assurance.py --as-of 2026-09-18T21:05:00Z > build/reports/knowledge_maintenance_assurance.json
      - name: Knowledge maintenance must remain held without owner cadence and approved release record
        run: python scripts/check_knowledge_maintenance_readiness.py examples/knowledge_maintenance_readiness_intent.json.example --as-of 2026-09-18T21:05:00Z --expected-status HOLD_NO_CURRENT_RELEASE_MAINTENANCE > build/reports/knowledge_maintenance_readiness.json
      - name: Exported security-edge ZIP assurance remains evidence-only
        run: python scripts/check_security_edge_zip_assurance.py --as-of 2026-09-18T21:45:00Z > build/reports/security_edge_zip_assurance.json
      - name: Security-edge readiness must remain held without current native ZIP assurance
        run: python scripts/check_security_edge_zip_readiness.py examples/security_edge_zip_readiness_intent.json.example --as-of 2026-09-18T21:45:00Z --expected-status HOLD_NO_CURRENT_SECURITY_EDGE_ZIP_ASSURANCE > build/reports/security_edge_zip_readiness.json
      - name: Exported native reconciliation assurance remains evidence-only
        run: python scripts/check_native_reconciliation_assurance.py --as-of 2026-09-18T22:05:00Z > build/reports/native_reconciliation_assurance.json
      - name: Native reconciliation readiness must remain held without current fencing and reconciliation
        run: python scripts/check_native_reconciliation_readiness.py examples/native_reconciliation_readiness_intent.json.example --as-of 2026-09-18T22:05:00Z --expected-status HOLD_NO_CURRENT_NATIVE_RECONCILIATION > build/reports/native_reconciliation_readiness.json
      - name: Exported native IPv6 assurance remains service-offer evidence only
        run: python scripts/check_native_ipv6_assurance.py --as-of 2026-09-18T22:05:00Z > build/reports/native_ipv6_assurance.json
      - name: Native IPv6 readiness must remain held without current native family qualification
        run: python scripts/check_native_ipv6_readiness.py examples/native_ipv6_readiness_intent.json.example --as-of 2026-09-18T22:05:00Z --expected-status HOLD_NO_CURRENT_NATIVE_IPV6_ASSURANCE > build/reports/native_ipv6_readiness.json
      - name: Exported production activation assurance remains non-authoritative
        run: python scripts/check_production_activation_assurance.py --as-of 2026-09-18T22:05:00Z > build/reports/production_activation_assurance.json
      - name: Production activation readiness must remain held without current authority and initial readiness
        run: python scripts/check_production_activation_readiness.py examples/production_activation_readiness_intent.json.example --as-of 2026-09-18T22:05:00Z --expected-status HOLD_NO_CURRENT_PRODUCTION_ACTIVATION_ASSURANCE > build/reports/production_activation_readiness.json
      - name: Exported identity and cryptographic trust assurance remains non-authoritative
        run: python scripts/check_identity_crypto_assurance.py --as-of 2026-09-18T23:00:00Z > build/reports/identity_crypto_assurance.json
      - name: Identity and cryptographic trust readiness must remain held without current native trust evidence
        run: python scripts/check_identity_crypto_readiness.py examples/identity_crypto_readiness_intent.json.example --as-of 2026-09-18T23:00:00Z --expected-status HOLD_NO_CURRENT_IDENTITY_CRYPTO_ASSURANCE > build/reports/identity_crypto_readiness.json
      - name: Exported storage data lifecycle assurance remains non-authoritative
        run: python scripts/check_storage_data_lifecycle_assurance.py --as-of 2026-09-19T01:50:00Z > build/reports/storage_data_lifecycle_assurance.json
      - name: Storage lifecycle readiness must remain held without current native storage evidence
        run: python scripts/check_storage_data_lifecycle_readiness.py examples/storage_data_lifecycle_readiness_intent.json.example --as-of 2026-09-19T01:50:00Z --expected-status HOLD_NO_CURRENT_STORAGE_LIFECYCLE_ASSURANCE > build/reports/storage_data_lifecycle_readiness.json
      - name: Exported origin-specific service-reply assurance remains non-authoritative
        run: python scripts/check_service_reply_assurance.py --as-of 2026-09-19T12:30:00Z > build/reports/service_reply_assurance.json
      - name: Service-reply readiness must remain held without current native reply-path evidence
        run: python scripts/check_service_reply_readiness.py examples/service_reply_readiness_intent.json.example --as-of 2026-09-19T12:30:00Z --expected-status HOLD_NO_CURRENT_SERVICE_REPLY_ASSURANCE > build/reports/service_reply_readiness.json
      - name: Exported bootstrap service assurance remains non-authoritative
        run: python scripts/check_bootstrap_service_assurance.py --as-of 2026-09-19T14:30:00Z > build/reports/bootstrap_service_assurance.json
      - name: Bootstrap service readiness must remain held without current target dependencies
        run: python scripts/check_bootstrap_service_readiness.py examples/bootstrap_service_readiness_intent.json.example --as-of 2026-09-19T14:30:00Z --expected-status HOLD_NO_CURRENT_BOOTSTRAP_SERVICE_ASSURANCE > build/reports/bootstrap_service_readiness.json
      - name: Exported actual-target selection assurance remains non-authoritative
        run: python -m provisioner.qualification.target_selection --as-of 2026-09-19T15:30:00Z > build/reports/target_selection_assurance.json
      - name: Target-selection readiness must remain held without an actual selected target
        run: python scripts/check_target_selection_readiness.py examples/target_selection_readiness_intent.json.example --as-of 2026-09-19T15:30:00Z --expected-status HOLD_NO_CURRENT_TARGET_SELECTION > build/reports/target_selection_readiness.json
      - name: Exported qualification-campaign evidence remains non-authoritative
        run: python -m provisioner.qualification.campaign --as-of 2026-09-19T16:30:00Z > build/reports/qualification_campaign_assurance.json
      - name: Qualification-campaign readiness must remain held without native campaign evidence
        run: python scripts/check_qualification_campaign_readiness.py examples/qualification_campaign_readiness_intent.json.example --as-of 2026-09-19T16:30:00Z --expected-status HOLD_NO_CURRENT_QUALIFICATION_CAMPAIGN_EVIDENCE > build/reports/qualification_campaign_readiness.json
      - name: Local regressions and route-model checks
        run: python tools/check_local.py
      - name: Known Nutanix task-tree and recovery campaign over loopback HTTPS
        run: python lab/run_task_tree_lab.py --execute
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: repository-local-test-reports
          path: build/reports/
          retention-days: 14
          if-no-files-found: warn
  ansible:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install candidate Ansible toolchain
        run: python -m pip install -r requirements-dev.txt
      - name: Syntax, safe local staging, idempotence, check mode and negative cases
        run: python scripts/verify_ansible.py
      - name: Install local guest service validation engines
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openssh-server rsyslog rsyslog-gnutls restic nftables
          sudo mkdir -p /run/sshd
      - name: Validate rendered guest configuration with real local engines
        run: sudo "$(command -v python)" lab/run_guest_services_lab.py --require-engines --scratch-root /etc/rsyslog.d
      - name: Verify protected root source under an actual other-UID worker
        run: sudo env PYTHONPATH=.:tests "$(command -v python)" -m unittest test_source_integrity.SourceIntegrityTests.test_protected_root_owned_checkout_is_readable_by_worker_without_ambient_git_trust -v
      - name: Recover useful synthetic data using the real restic engine
        run: python lab/run_restic_lab.py
      - name: Export synthetic versioned state over TLS and recover it with real restic
        run: python lab/run_state_protection_lab.py --execute
      - name: Exercise leased edge activation and withdrawal with real local packets
        run: sudo "$(command -v python)" lab/run_protected_source_lab.py --lab nft-edge
      - name: Exercise fixed guest probes with real certificate SSH and TLS
        run: sudo "$(command -v python)" lab/run_target_probe_lab.py --user "$(id -un)"
      - name: Execute a staged owner job through a real forced-command SSH worker
        run: sudo "$(command -v python)" lab/run_protected_source_lab.py --lab owner-worker -- --user "$(id -un)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ansible-local-test-reports
          path: |
            build/reports/ansible_validation.json
            build/reports/guest_services_lab.json
            build/reports/restic_recovery_lab.json
            build/reports/nft_edge_lab.json
            build/reports/target_probe_lab.json
            build/reports/owner_worker_lab.json
            build/reports/protected_source_*.json
          retention-days: 14
          if-no-files-found: warn
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - name: Review actual committed provider lock selections
        run: python scripts/check_dependency_locks.py
      - name: Saved-plan execution, stale-state rejection and private artifact permissions
        run: python lab/run_terraform_execution_lab.py
      - name: Install offline application wheel build dependencies
        run: python -m pip install 'setuptools>=80,<85' 'wheel>=0.45,<1'
      - name: Build and verify the actual offline execution runtime without network access
        run: sudo "$(command -v python)" lab/run_protected_source_lab.py --lab runtime-build -- --execute --terraform "$(command -v terraform)"
      - name: Backend-disabled validation, module schemas and plan-only provider mocks
        run: python tools/verify_terraform.py --mock-tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: terraform-engine-reports
          path: |
            build/reports/provider_lock_review.json
            build/reports/terraform_validation.json
            build/reports/terraform_execution_lab.json
            build/reports/runtime_build_lab.json
            build/reports/protected_source_*.json
            build/reports/toolchain-schemas/
            build/reports/toolchain-locks/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
