name: Application comparison operator source
on:
  push:
    branches: ['implementation/all-waves']
    paths: ['.github/workflows/application-operator-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture tracked source without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/application-operator"
          git bundle create "$RUNNER_TEMP/application-operator/source.bundle" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/application-operator/revision.txt"
          cd "$RUNNER_TEMP/application-operator"
          sha256sum source.bundle > source.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: application-operator-source-${{ github.sha }}
          path: ${{ runner.temp }}/application-operator/
          retention-days: 1
          if-no-files-found: error
