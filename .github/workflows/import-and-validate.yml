name: Initial source import and native validation
on:
  push:
    branches: [setup/architecture-implementation-library]
    paths: ['.bootstrap/**', '.github/workflows/import-and-validate.yml', 'ansible/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: initial-import-${{ github.ref }}
  cancel-in-progress: false
jobs:
  import-source:
    if: github.repository == 'awalker0878/multi-tenant' && github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.publish.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 .bootstrap/import_source.py
      - id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add terraform
          if ! git diff --cached --quiet; then
            git commit -m 'Import ten native Terraform module/root pairs from Increment 04'
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$REF_NAME"
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  terraform:
    needs: import-source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scope: [nsx-domain, nsx-gateway-quarantine, nsx-route, nutanix-domain, nutanix-route, nutanix-workload, openstack-domain, openstack-route, openstack-workload, vsphere-workload]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.import-source.outputs.revision }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Validate schemas and mocked plans; never apply
        env:
          SCOPE: ${{ matrix.scope }}
          TF_IN_AUTOMATION: 'true'
          TF_INPUT: '0'
          CHECKPOINT_DISABLE: '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/terraform
          terraform version -json > build/terraform/version.json
          for unit in modules roots; do
            directory="terraform/$unit/$SCOPE"
            terraform -chdir="$directory" init -backend=false -input=false -no-color 2>&1 | tee "build/terraform/$unit-init.txt"
            terraform -chdir="$directory" validate -json | tee "build/terraform/$unit-validation.json"
            terraform -chdir="$directory" providers schema -json > "build/terraform/$unit-schema.json"
            cp "$directory/.terraform.lock.hcl" "build/terraform/$unit.lock.hcl"
          done
          python3 - "$SCOPE" <<'PY'
          import json, pathlib, re, sys
          p = pathlib.Path('terraform/modules') / sys.argv[1]
          required = set(json.loads((p/'main.tf.json').read_text())['terraform']['required_providers'])
          tests = list((p/'tests').glob('*.tftest.hcl'))
          assert tests, 'No tests'
          for test in tests:
              text = test.read_text()
              assert not re.search(r'(?m)^\s*provider\s+"', text), 'Real provider in tests'
              assert not re.search(r'command\s*=\s*apply', text), 'Apply forbidden'
              assert len(re.findall(r'\brun\s+"', text)) == len(re.findall(r'command\s*=\s*plan', text)), 'Every run must be plan-only'
              assert required <= set(re.findall(r'mock_provider\s+"([^"]+)"', text)), 'Missing provider mock'
          PY
          terraform -chdir="terraform/modules/$SCOPE" test -no-color 2>&1 | tee build/terraform/mock-plan-tests.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: terraform-${{ matrix.scope }}
          path: build/terraform/
          retention-days: 7
  ansible:
    needs: import-source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.import-source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'ansible-core==2.19.3'
      - run: bash ansible/tests/validate.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ansible-local-validation
          path: build/ansible/
          retention-days: 7
