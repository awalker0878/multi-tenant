name: AHV destination components
on:
  pull_request:
    branches: [main, greenfield/enterprise-microservices-plan]
    paths: ['services/**', 'workers/**', 'apps/console/**', 'contracts/**', 'scripts/p08/**', 'scripts/p04/**', '.github/workflows/ahv-destination.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  components:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.19'
          enable-cache: false
      - name: Validate repository documentation and architecture
        run: |
          python -m pip install --requirement requirements-docs.txt
          python scripts/validate_docs.py
          python scripts/validate_architecture.py
          python -m unittest discover -s tests/documentation -p 'test_*.py' -q
      - name: Run all migration suites with real PostgreSQL and synthetic native peers
        env:
          P07_POSTGRES_BIN: /usr/lib/postgresql/16/bin
        run: python scripts/p08/qualify.py --output "$RUNNER_TEMP/ahv-components"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ahv-components-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ahv-components/
          if-no-files-found: error
          retention-days: 14
  console:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - name: Install exact console dependencies and browser
        run: |
          npm ci --prefix apps/console --ignore-scripts --no-audit --no-fund
          cd apps/console
          npx playwright install --with-deps --only-shell chromium
      - name: Verify AHV mapping, existing migration reviews and fleet flows
        run: python scripts/p08/qualify_browser.py --output "$RUNNER_TEMP/ahv-console"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ahv-console-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ahv-console/
          if-no-files-found: error
          retention-days: 14
