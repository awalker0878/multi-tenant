name: P01 policy controls
on:
  push:
    branches: [greenfield/enterprise-microservices-plan]
  pull_request:
    branches: [greenfield/enterprise-microservices-plan]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    name: Foundation policy controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Download exact reviewed signing/scanner candidates
        run: python3 scripts/p01/artifacts/tools.py --output "$RUNNER_TEMP/p01-tools"
      - name: Measure admission and real cryptographic negative controls
        run: >-
          python3 scripts/p01/run_policy_controls.py
          --output "$RUNNER_TEMP/p01-policy-evidence"
          --cosign "$RUNNER_TEMP/p01-tools/cosign"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-policy-controls-${{ github.sha }}
          path: ${{ runner.temp }}/p01-policy-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Scan tracked repository content with redacted evidence
        run: >-
          python3 scripts/p01/artifacts/repository_scan.py
          --trivy "$RUNNER_TEMP/p01-tools/trivy"
          --output "$RUNNER_TEMP/p01-repository-secrets"
      - name: Retain repository secret scan outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-repository-secrets-${{ github.sha }}
          path: ${{ runner.temp }}/p01-repository-secrets/
          if-no-files-found: error
          retention-days: 14
      - name: Record the exact successfully tested checkout
        run: python3 scripts/p01/record_check_source.py --name "Foundation policy controls"
      - name: Retain exact check source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: check-source-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p01-check-source/report.json
          if-no-files-found: error
          retention-days: 14
