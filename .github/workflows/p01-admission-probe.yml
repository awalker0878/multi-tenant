name: P01 admission deployment probe
on:
  push:
    branches: [greenfield/enterprise-microservices-plan]
    paths:
      - release/admission-probe.json
      - scripts/p01/admission/probe_pr.py
      - .github/workflows/p01-admission-probe.yml
permissions:
  contents: read
  pull-requests: read
  checks: read
jobs:
  probe:
    name: Admission deployment probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Probe the current target policy against the disposable PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/p01/admission/probe_pr.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-admission-probe-${{ github.sha }}
          path: ${{ runner.temp }}/p01-admission-probe/
          if-no-files-found: warn
          retention-days: 14
