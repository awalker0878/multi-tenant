[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "product-lifecycle"
version = "0.1.0.dev0"
description = "Lifecycle service bootstrap; durable simulation admission and execution"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]==3.3.6",
    "uvicorn==0.53.0",
    "temporalio==1.34.0",
]

[project.scripts]
lifecycle-workflows = "lifecycle.bootstrap.workflow:main"
lifecycle-health = "lifecycle.bootstrap.health:main"
lifecycle-serve = "lifecycle.bootstrap.server:main"

[dependency-groups]
dev = ["mypy==2.4.0", "pytest==9.1.1", "ruff==0.16.10"]
build = ["setuptools==84.0.0", "wheel==0.48.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lifecycle", "lifecycle.*"]
namespaces = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
