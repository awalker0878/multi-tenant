name: Publish reviewed application comparison operator
on:
  push:
    branches: ['implementation/all-waves']
    paths: ['.github/workflows/application-operator-publish.yml']
permissions:
  contents: write
concurrency:
  group: reviewed-application-operator-publication
  cancel-in-progress: false
jobs:
  reviewed-operator:
    if: github.repository == 'awalker0878/multi-tenant' && github.event_name == 'push' && github.ref == 'refs/heads/implementation/all-waves'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify exact baseline and reviewed commit series
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Repository review'
          git config user.email 'review@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, os, subprocess
          baseline='ca48ca36d4b8b59bccd41529b30841db43ec1f85'
          parts=[f'.github/application-operator-reviewed-{i}.b64' for i in range(2)]
          allowed=set(parts+['.github/workflows/application-operator-publish.yml'])
          subprocess.run(['git','merge-base','--is-ancestor',baseline,'HEAD'],check=True)
          changed=set(subprocess.check_output(['git','diff','--name-only','-z',baseline,'HEAD']).decode().strip('\0').split('\0'))
          if changed-allowed:
              raise SystemExit('Concurrent source change; publication refused')
          encoded=''.join(Path(part).read_text().strip() for part in parts)
          if len(encoded)!=29548:
              raise SystemExit('Reviewed transport length mismatch')
          packed=base64.b64decode(encoded,validate=True)
          if hashlib.sha256(packed).hexdigest()!='53272057e0afe76ac7a21d76ac699a40d1d33551b2ffe35753775301ce3080c1':
              raise SystemExit('Reviewed transport checksum mismatch')
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch=decoder.decompress(packed,max_length=1024*1024)
          if not decoder.eof or decoder.unused_data or len(patch)!=95884:
              raise SystemExit('Unexpected reviewed patch')
          if hashlib.sha256(patch).hexdigest()!='01a9929827971eb1c4fb6135955b9e5e1431fc45680cdb82ad8a6a802f8ebb7e':
              raise SystemExit('Reviewed implementation checksum mismatch')
          path=Path(os.environ['RUNNER_TEMP'])/'application-operator.patch'
          path.write_bytes(patch)
          subprocess.run(['git','am',str(path)],check=True)
          PY
      - name: Verify and isolate the exact transport-free tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          env=dict(os.environ,GIT_INDEX_FILE=str(Path(os.environ['RUNNER_TEMP'])/'delivery-index'))
          subprocess.run(['git','read-tree','HEAD'],env=env,check=True)
          transport=[f'.github/application-operator-reviewed-{i}.b64' for i in range(2)]+['.github/workflows/application-operator-publish.yml']
          subprocess.run(['git','update-index','--force-remove',*transport],env=env,check=True)
          actual=subprocess.check_output(['git','write-tree'],env=env).decode().strip()
          if actual!='fe6cb2bcaf68c00f7ee98f5f73c7dac794298896':
              raise SystemExit('Reviewed delivery tree mismatch: '+actual)
          candidate=subprocess.check_output(['git','commit-tree',actual,'-p','HEAD','-m','Temporary exact-tree validation candidate']).decode().strip()
          destination=str(Path(os.environ['RUNNER_TEMP'])/'operator-delivery')
          subprocess.run(['git','worktree','add','--detach',destination,candidate],check=True)
          print('Exact reviewed source tree verified:',actual)
          PY
      - name: Install repository and integration dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/operator-delivery"
          python -m pip install -r requirements-repository.txt -e '.[controlplane]' 'setuptools>=80,<85' 'wheel>=0.45,<1'
      - name: Test the reviewed deliverable
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/operator-delivery"
          python -m unittest discover -s tests/provisioning/api -p 'test_*.py'
          python -m unittest tests.provisioning.discovery.test_application_assessment tests.provisioning.discovery.test_service tests.provisioning.discovery.test_application_review tests.provisioning.unit.test_architecture tests.provisioning.unit.test_delivery_handoff
          python -m unittest tests.provisioning.documentation.test_documentation tests.provisioning.documentation.test_research_alignment tests.test_retired_interfaces
          python scripts/check_documentation.py
          python scripts/check_repository.py
          python scripts/check_retired_interfaces.py
          python scripts/check_installed_distribution.py
      - name: Publish implementation commits by ordinary fast-forward
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          git push origin HEAD:refs/heads/implementation/all-waves
          git log -3 --format='%h %s'
