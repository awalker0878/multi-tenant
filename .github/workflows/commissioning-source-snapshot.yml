name: Temporary commissioning source snapshot
on:
  push:
    branches: [feat/native-reference-commissioning]
    paths: [.github/workflows/commissioning-source-snapshot.yml]
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2a1231644f3ea0dc176616d54c584717730b7468
          persist-credentials: false
      - name: Archive only the inspected committed source
        run: |
          mkdir -p "$RUNNER_TEMP/commissioning-source"
          test "$(git rev-parse HEAD)" = 2a1231644f3ea0dc176616d54c584717730b7468
          git archive --format=tar.gz --prefix=multi-tenant/ HEAD > "$RUNNER_TEMP/commissioning-source/source.tar.gz"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/commissioning-source/revision.txt"
          cd "$RUNNER_TEMP/commissioning-source"
          sha256sum source.tar.gz > source.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: commissioning-exact-main-source
          path: ${{ runner.temp }}/commissioning-source/
          retention-days: 1
          if-no-files-found: error
