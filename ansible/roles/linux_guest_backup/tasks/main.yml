---
- name: Require approved backup image dependency
  ansible.builtin.assert:
    that:
      - "'restic' in ansible_facts.packages"

- name: Inspect installed backup executable
  ansible.builtin.stat:
    path: /usr/bin/restic
    checksum_algorithm: sha256
    get_checksum: true
  register: hosting_restic_binary

- name: Bind the actual executable to the protection profile
  ansible.builtin.assert:
    that:
      - hosting_restic_binary.stat.checksum == hosting_target.services.backup.config.restic_sha256

- name: Enroll only the bound guest export
  become: true
  block:
    - name: Create private backup configuration and evidence directories
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop: [/etc/hosting-backup, /var/lib/hosting-backup, /var/lib/hosting-backup/runs]

    - name: Create the owned executable package directories
      ansible.builtin.file:
        path: '/usr/local/lib/hosting/{{ item }}'
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop: [provisioner, provisioner/domain, provisioner/execution]

    - name: Install the exact reviewed backup implementation
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../../{{ item }}'
        dest: '/usr/local/lib/hosting/{{ item }}'
        owner: root
        group: root
        mode: '0644'
      loop:
        - provisioner/__init__.py
        - provisioner/domain/__init__.py
        - provisioner/domain/errors.py
        - provisioner/execution/__init__.py
        - provisioner/execution/restic_run.py
        - provisioner/execution/run_files.py
        - provisioner/execution/neutron_observe.py
        - provisioner/execution/readback_core.py

    - name: Install the bound export configuration
      ansible.builtin.copy:
        content: '{{ hosting_target.services.backup.config | to_nice_json }}'
        dest: /etc/hosting-backup/config.json
        owner: root
        group: root
        mode: '0600'
      no_log: true
      diff: false

    - name: Install scoped repository credentials and trust
      ansible.builtin.copy:
        src: '{{ hosting_target.services.backup[item.source].path }}'
        dest: '/etc/hosting-backup/{{ item.dest }}'
        owner: root
        group: root
        mode: '0600'
      loop:
        - {source: credentials, dest: credentials.json}
        - {source: ca, dest: ca.pem}
      no_log: true
      diff: false

    - name: Install the confined capture service and schedule
      ansible.builtin.template:
        src: '{{ item }}.j2'
        dest: '/etc/systemd/system/{{ item }}'
        owner: root
        group: root
        mode: '0644'
      loop: [hosting-backup.service, hosting-backup.timer]
      register: hosting_backup_units

    - name: Load changed backup units
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: hosting_backup_units.changed

    - name: Converge the explicitly authorized backup schedule
      ansible.builtin.systemd_service:
        name: hosting-backup.timer
        enabled: '{{ hosting_target.services.backup.enabled }}'
        state: "{{ 'started' if hosting_target.services.backup.enabled else 'stopped' }}"

    - name: Stop the owned capture process when protection is withdrawn
      ansible.builtin.systemd_service:
        name: hosting-backup.service
        state: stopped
      when: not hosting_target.services.backup.enabled
