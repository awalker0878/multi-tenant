name: Publish reviewed application owner evidence
on:
  push:
    branches: ['implementation/all-waves']
    paths: ['.github/workflows/owner-review-publish.yml']
permissions:
  contents: write
concurrency:
  group: reviewed-application-owner-publication
  cancel-in-progress: false
jobs:
  reviewed-owner:
    if: github.repository == 'awalker0878/multi-tenant' && github.event_name == 'push' && github.ref == 'refs/heads/implementation/all-waves'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify exact baseline and apply reviewed commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Repository review'
          git config user.email 'review@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, os, subprocess
          baseline='3ef293bcecfca3dc05de57d7c84ebe983ba01013'
          parts=[f'.github/owner-reviewed-{i}.b64' for i in range(3)]
          allowed=set(parts+['.github/workflows/owner-review-publish.yml'])
          subprocess.run(['git','merge-base','--is-ancestor',baseline,'HEAD'],check=True)
          changed=set(subprocess.check_output(['git','diff','--name-only','-z',baseline,'HEAD']).decode().strip('\0').split('\0'))
          if changed-allowed:
              raise SystemExit('Concurrent source change; publication refused')
          encoded=''.join(Path(part).read_text().strip() for part in parts)
          if len(encoded)!=34568:
              raise SystemExit('Reviewed transport length mismatch')
          packed=base64.b64decode(encoded,validate=True)
          if hashlib.sha256(packed).hexdigest()!='c31927f78f45cf745b8a18253fb8d3810ce8e70cc100cd1697030c0ed2bfeb92':
              raise SystemExit('Reviewed transport checksum mismatch')
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch=decoder.decompress(packed,max_length=1024*1024)
          if not decoder.eof or decoder.unused_data or len(patch)!=123110:
              raise SystemExit('Unexpected reviewed patch')
          if hashlib.sha256(patch).hexdigest()!='90c0cb41b7fa1813c4937615a85d09ae001ed9ced5671d88209ced7bb8771732':
              raise SystemExit('Reviewed implementation checksum mismatch')
          path=Path(os.environ['RUNNER_TEMP'])/'owner-review.patch'
          path.write_bytes(patch)
          subprocess.run(['git','am',str(path)],check=True)
          PY
      - name: Verify and isolate the transport-free source tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          env=dict(os.environ,GIT_INDEX_FILE=str(Path(os.environ['RUNNER_TEMP'])/'delivery-index'))
          subprocess.run(['git','read-tree','HEAD'],env=env,check=True)
          transport=[f'.github/owner-reviewed-{i}.b64' for i in range(3)]+['.github/workflows/owner-review-publish.yml']
          subprocess.run(['git','update-index','--force-remove',*transport],env=env,check=True)
          actual=subprocess.check_output(['git','write-tree'],env=env).decode().strip()
          if actual!='40ea896b2f31a0c7c928a89a83be7ca83e330414':
              raise SystemExit('Reviewed delivery tree mismatch: '+actual)
          candidate=subprocess.check_output(['git','commit-tree',actual,'-p','HEAD','-m','Temporary exact-tree validation candidate']).decode().strip()
          destination=str(Path(os.environ['RUNNER_TEMP'])/'owner-delivery')
          subprocess.run(['git','worktree','add','--detach',destination,candidate],check=True)
          print('Exact reviewed source tree verified:',actual)
          PY
      - name: Install repository and integration dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/owner-delivery"
          python -m pip install -r requirements-repository.txt -e '.[controlplane]' 'httpx==0.28.1' 'setuptools>=80,<85' 'wheel>=0.45,<1'
      - name: Test the exact deliverable without publication files
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/owner-delivery"
          python -m unittest discover -s tests/provisioning/discovery -p 'test_*.py'
          python -m unittest discover -s tests/provisioning/api -p 'test_*.py'
          python -m unittest tests.provisioning.unit.test_architecture tests.provisioning.documentation.test_documentation tests.provisioning.documentation.test_research_alignment tests.test_retired_interfaces
          python scripts/check_documentation.py
          python scripts/check_repository.py
          python scripts/check_retired_interfaces.py
          python scripts/check_installed_distribution.py
      - name: Publish by ordinary fast-forward only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          git push origin HEAD:refs/heads/implementation/all-waves
          git log -3 --format='%h %s'
