name: P08 native migration components
on:
  push:
    branches: [main, greenfield/enterprise-microservices-plan]
    paths: ['services/inventory/**', 'services/governance/**', 'services/planning/**', 'apps/console/**', 'contracts/schemas/**', 'contracts/openapi/inventory-v1.*.json', 'contracts/openapi/inventory-native-*.json', 'contracts/openapi/governance-native-*.json', 'contracts/openapi/planning-v1.1.json', 'services/lifecycle/**', 'workers/lifecycle/**', 'workers/inventory/**', 'scripts/p08/**', 'contracts/openapi/*migration*', 'contracts/fixtures/lifecycle/migration-*', '.github/workflows/p08-native-migration.yml']
  pull_request:
    branches: [main, greenfield/enterprise-microservices-plan]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  components:
    name: P08 migration control and native components (E2 only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.19'
          enable-cache: false
      - name: Qualify source readiness, isolated capture, cutover and recovery control
        env:
          P07_POSTGRES_BIN: /usr/lib/postgresql/16/bin
        run: python scripts/p08/qualify.py --output "$RUNNER_TEMP/p08-components"
      - name: Retain source-bound original observations, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p08-components-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p08-components/
          if-no-files-found: error
          retention-days: 14

  review-ui:
    name: P08 migration review browser (isolated HTTP fixture)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - name: Install exact Console lock and Chromium
        run: |
          npm ci --prefix apps/console --ignore-scripts --no-audit --no-fund
          cd apps/console
          npx playwright install --with-deps --only-shell chromium
      - name: Verify all-disk review, uncertain retry, confirmation and stale/revoked access
        run: python scripts/p08/qualify_browser.py --output "$RUNNER_TEMP/p08-browser"
      - name: Retain source-bound UI observations including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p08-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p08-browser/
          if-no-files-found: error
          retention-days: 14
