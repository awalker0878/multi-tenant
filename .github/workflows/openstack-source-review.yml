name: OpenStack source review
on:
  push:
    branches: ['implementation/all-waves']
    paths: ['.github/workflows/openstack-source-review.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture tracked source without credentials
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/source-review"
          git bundle create "$RUNNER_TEMP/source-review/source.bundle" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/source-review/revision.txt"
          cd "$RUNNER_TEMP/source-review"
          sha256sum source.bundle > source.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openstack-source-${{ github.sha }}
          path: ${{ runner.temp }}/source-review/
          retention-days: 1
          if-no-files-found: error
