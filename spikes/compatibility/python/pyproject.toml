[project]
name = "p00-python-compatibility"
version = "0.0.0"
description = "Disposable dependency and execution probe; not a service"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2,<3", "httpx>=0.28,<0.29"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "import-linter==2.15",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "smoke.py", "boundary_probe.py", "record_tooling.py"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers"
