name: Apply reviewed mobility changes
on:
  push:
    branches: ['implementation/all-waves']
    paths: ['.github/workflows/mobility-source-review.yml']
permissions:
  contents: write
concurrency:
  group: mobility-reviewed-patch-publication
  cancel-in-progress: false
jobs:
  reviewed-changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/implementation/all-waves'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact publication revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up reviewed Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify baseline and apply the reviewed commit series
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Repository review'
          git config user.email 'review@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, os, subprocess
          baseline='92ab87bea1befca198f3fa605128e57616c0e967'
          parts=[f'.github/mobility-review-core-{i}.b64' for i in range(5)]
          allowed=set(parts+['.github/workflows/mobility-source-review.yml'])
          subprocess.run(['git','merge-base','--is-ancestor',baseline,'HEAD'],check=True)
          changed=set(subprocess.check_output(['git','diff','--name-only','-z',baseline,'HEAD']).decode().strip('\0').split('\0'))
          if changed-allowed:
              raise SystemExit('Concurrent source changes detected; publication refused')
          encoded=''.join(Path(p).read_text().strip() for p in parts)
          if len(encoded)!=51488:
              raise SystemExit('Unexpected patch transport size')
          packed=base64.b64decode(encoded,validate=True)
          if hashlib.sha256(packed).hexdigest()!='e743d1f5c5f6742d64cbed1bcbc10e916f2ed29795e5636e57e51e535be8edba':
              raise SystemExit('Patch transport checksum mismatch')
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch=decoder.decompress(packed,max_length=1024*1024+1)
          if not decoder.eof or decoder.unused_data or len(patch)!=236475:
              raise SystemExit('Unexpected decompressed patch')
          if hashlib.sha256(patch).hexdigest()!='df3befb422aa8af0df1a2ccc326cde32f4ca92267a731e7e4ae131f97a8cb748':
              raise SystemExit('Reviewed patch checksum mismatch')
          path=Path(os.environ['RUNNER_TEMP'])/'reviewed-mobility.patch'
          path.write_bytes(patch)
          subprocess.run(['git','-c','core.hooksPath=/dev/null','am',str(path)],check=True)
          PY
      - name: Install repository test dependencies
        run: python -m pip install -r requirements-repository.txt
      - name: Regenerate reviewed fixture identities without enabling execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          from provisioner.domain.request import digest
          from tests.provisioning import support
          root=Path.cwd()
          def write(path, doc):
              compact=len(path.read_text().splitlines())==1
              options={'separators':(',',':')} if compact else {'indent':2}
              path.write_text(json.dumps(doc,sort_keys=True,**options)+'\n')
          def fingerprints(plan):
              return {'request_digest':plan.request.digest,'plan_digest':plan.digest,
                  'manifest_digest':plan.manifest_digest,'resolution_digest':digest(plan.resolution.to_dict()),
                  'placement_digest':plan.decision.digest,'desired_state_digest':plan.desired_state.digest,
                  'environment_digest':digest(plan.environment),'conformance_digest':digest(plan.conformance),
                  'compiled_files':sorted(plan.compiled),'status':plan.status,'native_contact':plan.native_contact}
          index_path=root/'examples/golden/digests.json'
          index=json.loads(index_path.read_text())
          for name in support.REFERENCE_REQUESTS:
              plan=support.reference_plan(name)
              p=root/f'examples/resolved/{name}.resolution.json'
              payload=json.loads(p.read_text())
              for key,value in plan.resolution.to_dict().items():
                  if key in payload and key not in {'format','limits'}:
                      payload[key]=value
              payload['limits']=list(dict.fromkeys(payload['limits']+list(plan.resolution.limits)))
              payload['request_digest']=plan.request.digest
              payload['policy']=dict(plan.policy)
              write(p,payload)
              for suffix,payload in [('placement',plan.decision.to_dict()),('desired-state',plan.desired_state.to_dict())]:
                  write(root/f'examples/resolved/{name}.{suffix}.json',payload)
              for suffix,payload in [('environment',plan.environment),('conformance',plan.conformance)]:
                  write(root/f'examples/golden/{name}.{suffix}.json',payload)
              index['subjects'][name].update(fingerprints(plan))
          catalog=support.catalogs()
          catalog_ref={'versions':catalog.versions,'digest':catalog.digest}
          index['catalogs']=catalog_ref
          write(index_path,index)
          p=root/'examples/golden/cross-platform.digests.json'
          index=json.loads(p.read_text())
          index['catalogs']=catalog_ref
          for name,row in index['requests'].items():
              for platform,cell in row['platforms'].items():
                  plan=support.platform_plan(platform,name)
                  cell.update({k:v for k,v in fingerprints(plan).items() if k in cell})
                  cell['realization_gaps']=sorted(w['code'] for w in plan.warnings)
          write(p,index)
          PY
          git add examples/golden examples/resolved
          git -c core.hooksPath=/dev/null commit -m 'test(profiles): refresh disabled planning fixtures after capability changes'
      - name: Verify exact reviewed source tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          env=dict(os.environ,GIT_INDEX_FILE=str(Path(os.environ['RUNNER_TEMP'])/'review-normalized-index'))
          subprocess.run(['git','read-tree','HEAD'],env=env,check=True)
          transport=['.github/workflows/mobility-source-review.yml']+[f'.github/mobility-review-core-{i}.b64' for i in range(5)]
          subprocess.run(['git','update-index','--force-remove',*transport],env=env,check=True)
          actual=subprocess.check_output(['git','write-tree'],env=env).decode().strip()
          expected='3ff42c10ba18797abe6d5cdde7dc84e646ac2768'
          if actual!=expected:
              raise SystemExit(f'Reviewed source tree mismatch: {actual} != {expected}')
          print('Exact reviewed source tree verified:',actual)
          PY
      - name: Run focused regression and architecture checks
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_capability_coverage tests.test_platform_capabilities tests.test_platform_qualification -v
          python -m unittest discover -s tests/provisioning/policy -p 'test_*.py' -v
          python -m unittest discover -s tests/provisioning/placement -p 'test_*.py' -v
          python -m unittest tests.provisioning.end_to_end.test_golden -v
          python -m provisioner.qualification.registry
          python scripts/check_documentation.py
      - name: Publish only by ordinary fast-forward
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          git push origin HEAD:refs/heads/implementation/all-waves
          git log -5 --format='%h %s'
