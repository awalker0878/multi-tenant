name: Contract source and consumer integrity
on:
  pull_request:
    paths: ['contracts/**', 'services/planning/**', 'services/lifecycle/**', 'services/inventory/**', 'apps/console/**', 'workers/**', 'tests/contracts/**', 'scripts/contracts/**', 'scripts/p03/generate_clients.py', 'scripts/p04/generate_clients.py', 'scripts/p05/generate_contracts.py', 'scripts/p06/generate_contracts.py', 'scripts/p08/check_any_to_any.py', '.github/workflows/contracts-integrity.yml']
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Install pinned contract validators
        run: python -m pip install --disable-pip-version-check -r scripts/contracts/requirements.txt
      - name: Check canonical embedded readiness projection
        run: python scripts/contracts/generate_readiness.py
      - name: Check assembled contract bundles
        run: python scripts/contracts/build.py --check
      - name: Check wire versions, schemas, route parity and consumer drift
        run: python scripts/contracts/check.py
      - name: Validate negative drift tests
        run: python -m unittest discover -s tests/contracts -p 'test_integrity.py' -v
      - name: Install bounded owner contract test dependencies
        run: python -m pip install --disable-pip-version-check -e services/planning -e services/lifecycle pytest==9.1.1
      - name: Validate real Planning and Lifecycle readiness producers and consumers
        env:
          PYTHONPATH: services/planning/src:services/lifecycle/src:services/planning/tests
        run: python -m pytest -q services/planning/tests/test_migration_readiness.py services/lifecycle/tests/test_migration_readiness.py services/planning/tests/test_migration_support.py
