name: Data-only import vocabulary
on:
  push:
    branches: [audit/completion-corrections]
    paths: ['.github/workflows/data-codebook.yml']
permissions:
  contents: read
jobs:
  vocabulary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install tiktoken==0.12.0
      - name: Print reproducible public vocabulary; no repository data or credentials
        run: |
          python - <<'PY'
          import hashlib,re,tiktoken
          e=tiktoken.get_encoding('o200k_base');words=[];seen=set()
          for i in range(e.n_vocab):
              try: b=e.decode_single_token_bytes(i)
              except KeyError: continue
              if re.fullmatch(rb' [A-Za-z]{2,16}',b):
                  s=b[1:].decode()
                  if s not in seen: words.append(s);seen.add(s)
              if len(words)==16384: break
          assert len(words)==16384
          print('DICTIONARY_SHA256',hashlib.sha256(('\n'.join(words)+'\n').encode()).hexdigest())
          for i in range(0,len(words),1024): print('WORDS',i,' '.join(words[i:i+1024]))
          PY
