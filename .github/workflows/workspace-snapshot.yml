name: Temporary exact source snapshot
on:
  push:
    branches: [work/routed-ipv6-qualification]
    paths: [.github/workflows/workspace-snapshot.yml]
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3449df88516d454ce0c6cf5e3b663d88d128bfa2
          persist-credentials: false
      - name: Archive only committed source at the inspected main revision
        run: |
          mkdir -p "$RUNNER_TEMP/source-snapshot"
          test "$(git rev-parse HEAD)" = 3449df88516d454ce0c6cf5e3b663d88d128bfa2
          git archive --format=tar.gz --prefix=multi-tenant/ HEAD > "$RUNNER_TEMP/source-snapshot/source.tar.gz"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source-snapshot/revision.txt"
          cd "$RUNNER_TEMP/source-snapshot"
          sha256sum source.tar.gz > source.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-main-source
          path: ${{ runner.temp }}/source-snapshot/
          retention-days: 1
          if-no-files-found: error
