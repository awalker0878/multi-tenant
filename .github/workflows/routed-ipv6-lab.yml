name: Routed IPv6 laboratory
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: routed-ipv6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  routed-families:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install disposable fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2 gcc libc6-dev linux-libc-dev openssl
          python -m pip install -r requirements-repository.txt
      - name: Retained IPv4 packet and service-identity regression
        run: python lab/run_namespace_lab.py --execute
      - name: Fixed IPv6 routing, denial, service replies and recovery experiment
        run: python lab/run_ipv6_lab.py --execute
      - name: Preserve only synthetic local laboratory results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: routed-family-fixtures
          path: |
            build/reports/local_packet_lab.json
            build/reports/local_ipv6_packet_lab.json
          retention-days: 14
          if-no-files-found: error
