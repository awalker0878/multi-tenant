name: Corrective release toolchain validation
on:
  push:
    branches: [audit/complete-docs-and-validation]
    paths: ['tools/verify_terraform.py', 'scripts/verify_ansible.py', '.github/workflows/corrective-toolchain.yml', 'terraform/**', 'ansible/**']
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scope: [nsx-domain, nsx-route, nsx-gateway-quarantine, vsphere-workload, nutanix-domain, nutanix-route, nutanix-workload, openstack-domain, openstack-route, openstack-workload]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - name: Validate unchanged roots without backend contact and mocked plans only
        env:
          SCOPE: ${{ matrix.scope }}
        run: python tools/verify_terraform.py --mock-tests --scope "$SCOPE"
      - name: Show exact result and generated lock provenance
        if: always()
        run: |
          cat build/reports/terraform_validation.json
          find build/reports/toolchain-locks/roots -name .terraform.lock.hcl -exec cat {} \; || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: corrective-terraform-${{ matrix.scope }}
          path: build/reports/
          include-hidden-files: true
          retention-days: 14
  ansible:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/verify_ansible.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: corrective-ansible
          path: build/reports/ansible_validation.json
          retention-days: 14
