name: Apply isolated mobility candidate
on:
  push:
    branches: [implementation/mobility-integrity-closure]
    paths: [.github/mobility-candidate.json]
permissions:
  contents: write
concurrency:
  group: mobility-candidate-application
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/implementation/mobility-integrity-closure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify and apply the tested commit series
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          root=pathlib.Path.cwd()
          payload=json.loads(pathlib.Path('.github/mobility-candidate.json').read_text())
          assert payload['base_commit']=='8dcbd973cfc4c97a211a6b92bcefee12cc8cd43f'
          subprocess.run(['git','merge-base','--is-ancestor',payload['base_commit'],'HEAD'],check=True)
          changed=set(subprocess.check_output(['git','diff','--name-only',payload['base_commit'],'HEAD'],text=True).splitlines())
          assert changed <= {'.github/workflows/mobility-patch-apply.yml','.github/mobility-candidate.json'}, changed
          chunks=[]
          for sha in payload['delta_blobs']:
              assert len(sha)==40 and all(c in '0123456789abcdef' for c in sha)
              request=urllib.request.Request('https://api.github.com/repos/awalker0878/multi-tenant/git/blobs/'+sha,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  blob=json.load(response)
              assert blob['sha']==sha and blob['encoding']=='base64'
              chunks.append(base64.b64decode(blob['content']))
          raw=lzma.decompress(b''.join(chunks))
          assert len(raw)<=2000000 and hashlib.sha256(raw).hexdigest()==payload['delta_sha256']
          data=json.loads(raw)
          for group in data['groups']:
              paths=[]
              for entry in group['files']:
                  path=pathlib.Path(entry['path'])
                  assert not path.is_absolute() and '..' not in path.parts and path.parts[0] not in ('.git','.github')
                  assert not path.is_symlink() and path.resolve().is_relative_to(root)
                  old=path.read_bytes() if path.exists() else None
                  assert (hashlib.sha256(old).hexdigest() if old is not None else None)==entry['before'],str(path)
                  if entry['after'] is None:
                      path.unlink()
                  else:
                      parts=[]
                      for op in entry['ops']:
                          if isinstance(op,list):
                              assert len(op)==2 and old is not None and 0<=op[0]<=op[1]<=len(old)
                              parts.append(old[op[0]:op[1]])
                          else:
                              assert isinstance(op,str)
                              parts.append(op.encode('utf-8'))
                      new=b''.join(parts)
                      assert hashlib.sha256(new).hexdigest()==entry['after'],str(path)
                      path.parent.mkdir(parents=True,exist_ok=True)
                      path.write_bytes(new)
                  paths.append(str(path))
              if paths:
                  subprocess.run(['git','add','--',*paths],check=True)
                  subprocess.run(['git','commit','-m',group['message']],check=True)
          PY
          git push origin HEAD:implementation/mobility-integrity-closure
