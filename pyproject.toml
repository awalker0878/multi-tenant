[build-system]
requires = ["setuptools>=80,<85", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "hosting-provisioner"
version = "0.1.0"
description = "Portable hosting provisioning and workload mobility planning"
requires-python = ">=3.12"
dependencies = [
  "PyYAML==6.0.2",
  "Jinja2==3.1.6",
  "dnspython==2.8.0",
  "cryptography==46.0.4",
]

[project.optional-dependencies]
controlplane = [
  "psycopg[binary]==3.3.4",
  "temporalio==1.33.0",
  "PyJWT[crypto]==2.15.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "uvicorn==0.54.0",
  "boto3==1.43.103",
]

[project.scripts]
hosting = "provisioner.cli.main:main"
hosting-operator = "provisioner.cli.operator:main"
hosting-api = "provisioner.controlplane.api.server:main"
hosting-evidence = "provisioner.controlplane.evidence.runtime:main"
hosting-site-worker = "provisioner.controlplane.worker.runtime:main"

[tool.setuptools.packages.find]
include = ["provisioner*", "tools", "scripts"]
namespaces = false

[tool.setuptools.package-data]
provisioner = ["inventory/fixtures/*.json", "schemas/v1/*.json", "controlplane/persistence/migrations/*.sql", "controlplane/api/portal/*.html", "controlplane/api/portal/*.js", "controlplane/api/portal/*.css", "retired_interfaces.json"]
