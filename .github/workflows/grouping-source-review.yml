name: Publish reviewed application draft integration
on:
  push:
    branches: ['implementation/all-waves']
    paths: ['.github/workflows/grouping-source-review.yml']
permissions:
  contents: write
concurrency:
  group: reviewed-application-draft-publication
  cancel-in-progress: false
jobs:
  reviewed-drafts:
    if: github.repository == 'awalker0878/multi-tenant' && github.event_name == 'push' && github.ref == 'refs/heads/implementation/all-waves'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify exact source and reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Repository automation'
          git config user.email 'mobility-automation@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, os, subprocess
          baseline='3afdcdc7081a3d4efacd532f9dbbc0ae19c1dfca'
          parts=[f'.github/application-reviewed-{i}.b64' for i in range(3)]
          allowed=set(parts+['.github/workflows/grouping-source-review.yml'])
          subprocess.run(['git','merge-base','--is-ancestor',baseline,'HEAD'],check=True)
          changed=set(subprocess.check_output(['git','diff','--name-only','-z',baseline,'HEAD']).decode().strip('\0').split('\0'))
          if changed-allowed:
              raise SystemExit('Concurrent source change; publication refused')
          encoded=''.join(Path(part).read_text().strip() for part in parts)
          if len(encoded)!=37088:
              raise SystemExit('Unexpected reviewed transport length')
          packed=base64.b64decode(encoded,validate=True)
          if hashlib.sha256(packed).hexdigest()!='384e69d8775f3e140ede2ab4a6fcd68db33632693c2f42acd6de3e6465b5374b':
              raise SystemExit('Reviewed transport checksum mismatch')
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch=decoder.decompress(packed,max_length=1024*1024)
          if not decoder.eof or decoder.unused_data or len(patch)!=122888:
              raise SystemExit('Unexpected reviewed patch')
          if hashlib.sha256(patch).hexdigest()!='38e36f8b242473f1abf9a25e04779b0418c5b3ea713560de03eb195d2d108d71':
              raise SystemExit('Reviewed implementation checksum mismatch')
          path=Path(os.environ['RUNNER_TEMP'])/'application-drafts.patch'
          path.write_bytes(patch)
          subprocess.run(['git','-c','core.hooksPath=/dev/null','am',str(path)],check=True)
          PY
      - name: Isolate and verify the transport-free source tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          env=dict(os.environ,GIT_INDEX_FILE=str(Path(os.environ['RUNNER_TEMP'])/'delivery-index'))
          subprocess.run(['git','read-tree','HEAD'],env=env,check=True)
          transport=[f'.github/application-reviewed-{i}.b64' for i in range(3)]+['.github/workflows/grouping-source-review.yml']
          subprocess.run(['git','update-index','--force-remove',*transport],env=env,check=True)
          actual=subprocess.check_output(['git','write-tree'],env=env).decode().strip()
          if actual!='265bfe56079add09cd90715053397c4fbe59c0c4':
              raise SystemExit('Reviewed delivery tree mismatch: '+actual)
          candidate=subprocess.check_output(['git','commit-tree',actual,'-p','HEAD','-m','Temporary exact-tree validation candidate']).decode().strip()
          destination=str(Path(os.environ['RUNNER_TEMP'])/'draft-delivery')
          subprocess.run(['git','worktree','add','--detach',destination,candidate],check=True)
          print('Exact reviewed source tree verified:',actual)
          PY
      - name: Install pinned repository and integration dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/draft-delivery"
          python -m pip install -r requirements-repository.txt -e '.[controlplane]' 'httpx==0.28.1'
      - name: Test reviewed contracts, API, documentation and installed package
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/draft-delivery"
          python -m unittest discover -s tests/provisioning/discovery -p 'test_*.py'
          python -m unittest tests.provisioning.api.test_application_drafts_http tests.provisioning.api.test_http tests.provisioning.api.test_discovery_http
          python -m unittest tests.provisioning.documentation.test_research_alignment tests.provisioning.documentation.test_documentation tests.test_retired_interfaces
          python scripts/check_documentation.py
          python scripts/check_repository.py
          python scripts/check_retired_interfaces.py
          python scripts/check_installed_distribution.py
      - name: Publish reviewed commits using ordinary fast-forward
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          git push origin HEAD:refs/heads/implementation/all-waves
          git log -4 --format='%h %s'
