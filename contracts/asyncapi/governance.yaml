asyncapi: 3.0.0
info:
  title: Governance committed change notifications
  version: 1.0.0
  description: P02 reference events. Stable event identity; at-least-once, unordered
    delivery; never current authorization.
channels:
  tenant_changed:
    address: governance.tenant.changed.v1
    description: Private governance.events topic exchange; consumer-owned durable
      queues. Notification only.
    messages:
      change:
        $ref: '#/components/messages/Change'
  membership_changed:
    address: governance.membership.changed.v1
    description: Private governance.events topic exchange; consumer-owned durable
