[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "product-inventory"
version = "0.1.0.dev0"
description = "Inventory service bootstrap; discovery and observations are not implemented"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["psycopg[binary]==3.3.6", "uvicorn==0.53.0", "pika==1.4.4"]

[project.scripts]
inventory-health = "inventory.bootstrap.health:main"
inventory-publish = "inventory.bootstrap.publish:main"
inventory-serve = "inventory.bootstrap.server:main"

[dependency-groups]
dev = ["mypy==2.4.0", "pytest==9.1.1", "ruff==0.16.10"]
build = ["setuptools==84.0.0", "wheel==0.48.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["inventory", "inventory.*"]
namespaces = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "typings"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
