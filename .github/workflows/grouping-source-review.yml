name: Application review source snapshot
on:
  push:
    branches: ['implementation/all-waves']
    paths: ['.github/workflows/grouping-source-review.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Export tracked source without repository credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/grouping-review"
          git rev-parse HEAD > "$RUNNER_TEMP/grouping-review/revision.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/grouping-review/source.tar.gz"
          cd "$RUNNER_TEMP/grouping-review"
          sha256sum source.tar.gz > source.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grouping-source-${{ github.sha }}
          path: ${{ runner.temp }}/grouping-review/
          retention-days: 1
          if-no-files-found: error
