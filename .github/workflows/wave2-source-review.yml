name: Publish reviewed AHV discovery
on:
  push:
    branches: ['implementation/all-waves']
    paths: ['.github/workflows/wave2-source-review.yml']
permissions:
  contents: write
concurrency:
  group: reviewed-ahv-discovery-publication
  cancel-in-progress: false
jobs:
  reviewed-discovery:
    if: github.event_name == 'push' && github.ref == 'refs/heads/implementation/all-waves'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify exact baseline and apply reviewed commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Repository automation'
          git config user.email 'mobility-automation@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, os, subprocess
          baseline='05c30734568baa47999198b34c339789b5dce37d'
          parts=[f'.github/ahv-reviewed-{i}.b64' for i in range(3)]
          allowed=set(parts+['.github/workflows/wave2-source-review.yml'])
          subprocess.run(['git','merge-base','--is-ancestor',baseline,'HEAD'],check=True)
          changed=set(subprocess.check_output(['git','diff','--name-only','-z',baseline,'HEAD']).decode().strip('\0').split('\0'))
          if changed-allowed:
              raise SystemExit('Concurrent source changes; publication refused')
          encoded=''.join(Path(part).read_text().strip() for part in parts)
          if len(encoded)!=27688:
              raise SystemExit('Reviewed patch transport length mismatch')
          packed=base64.b64decode(encoded,validate=True)
          if hashlib.sha256(packed).hexdigest()!='943e95f738d722bb7eb03113087477cad063e3fde5ad9301cdd802386adbe412':
              raise SystemExit('Reviewed patch transport checksum mismatch')
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch=decoder.decompress(packed,max_length=1024*1024)
          if not decoder.eof or decoder.unused_data or len(patch)!=90811:
              raise SystemExit('Unexpected decompressed patch')
          if hashlib.sha256(patch).hexdigest()!='3dd23531305a3743083fdd7ad27fe8398fe5e4aed37f6a82d9a849210e40db0c':
              raise SystemExit('Reviewed implementation checksum mismatch')
          path=Path(os.environ['RUNNER_TEMP'])/'reviewed-ahv.patch'
          path.write_bytes(patch)
          subprocess.run(['git','am',str(path)],check=True)
          PY
      - name: Verify and isolate the exact reviewed delivery tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          env=dict(os.environ,GIT_INDEX_FILE=str(Path(os.environ['RUNNER_TEMP'])/'delivery-index'))
          subprocess.run(['git','read-tree','HEAD'],env=env,check=True)
          transport=[f'.github/ahv-reviewed-{i}.b64' for i in range(3)]+['.github/workflows/wave2-source-review.yml']
          subprocess.run(['git','update-index','--force-remove',*transport],env=env,check=True)
          actual=subprocess.check_output(['git','write-tree'],env=env).decode().strip()
          if actual!='e455b43c9187bb85fdf261fe2964521c7e08ad86':
              raise SystemExit('Reviewed delivery tree mismatch: '+actual)
          candidate=subprocess.check_output(['git','commit-tree',actual,'-p','HEAD','-m','Temporary exact-tree validation candidate']).decode().strip()
          destination=str(Path(os.environ['RUNNER_TEMP'])/'ahv-delivery')
          subprocess.run(['git','worktree','add','--detach',destination,candidate],check=True)
          print('Exact reviewed source tree verified:',actual)
          PY
      - name: Install repository integration and package-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ahv-delivery"
          python -m pip install -r requirements-repository.txt -e '.[controlplane]' 'setuptools>=80,<85' 'wheel>=0.45,<1'
      - name: Verify the transport-free deliverable
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ahv-delivery"
          python -m unittest discover -s tests/provisioning/discovery -p 'test_*.py'
          python -m unittest tests.provisioning.controlplane.test_ahv_discovery tests.provisioning.controlplane.test_ahv_hardware
          python -m unittest tests.provisioning.end_to_end.test_golden tests.test_retired_interfaces tests.provisioning.documentation.test_documentation tests.provisioning.documentation.test_research_alignment
          python scripts/check_documentation.py
          python scripts/check_repository.py
          python scripts/check_retired_interfaces.py
          python scripts/check_installed_distribution.py
      - name: Publish implementation commits by ordinary fast-forward
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          git push origin HEAD:refs/heads/implementation/all-waves
          git log -3 --format='%h %s'
