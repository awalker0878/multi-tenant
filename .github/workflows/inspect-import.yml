name: Inspect checked-out import data
on:
  push:
    branches: [audit/completion-corrections]
    paths: ['.import/legacy/**', 'ci/inspect_legacy_data.py', '.github/workflows/inspect-import.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Inspect data without executing extracted content or contacting any target
        run: python3 ci/inspect_legacy_data.py
