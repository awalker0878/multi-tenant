name: Temporary artifact transport codebook
on:
  push:
    branches: [bootstrap/artifact-library-and-validation]
    paths: ['.github/workflows/import-codebook.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build a fixed reversible word alphabet for the one-time text-only connector import
        run: |
          python -m pip install tiktoken==0.12.0
          mkdir -p reports/codebook
          python - <<'PY'
          import hashlib, json, re, tiktoken
          from pathlib import Path
          e = tiktoken.get_encoding('o200k_base')
          words = []
          for i in range(e.n_vocab):
              try:
                  token = e.decode_single_token_bytes(i)
              except KeyError:
                  continue
              if re.fullmatch(rb' [A-Za-z]{2,16}', token):
                  word = token[1:].decode('ascii')
                  if word not in words:
                      words.append(word)
              if len(words) == 16384:
                  break
          assert len(words) == 16384
          data = ('\n'.join(words) + '\n').encode()
          Path('reports/codebook/words.txt').write_bytes(data)
          Path('reports/codebook/manifest.json').write_text(json.dumps({'algorithm': 'o200k_base token-order ASCII space plus letters length2..16 first16384', 'sha256': hashlib.sha256(data).hexdigest(), 'words': len(words)}, indent=2))
          print(hashlib.sha256(data).hexdigest())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: temporary-import-codebook
          path: reports/codebook/
          retention-days: 7
