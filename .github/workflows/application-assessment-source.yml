name: Application assessment continuation source
on:
  push:
    branches: ['implementation/all-waves']
    paths: ['.github/workflows/application-assessment-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture exact tracked source without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/application-assessment"
          git bundle create "$RUNNER_TEMP/application-assessment/source.bundle" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/application-assessment/revision.txt"
          cd "$RUNNER_TEMP/application-assessment"
          sha256sum source.bundle > source.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: application-assessment-source-${{ github.sha }}
          path: ${{ runner.temp }}/application-assessment/
          retention-days: 1
          if-no-files-found: error
