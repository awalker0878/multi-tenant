- name: Restrict validation to fixed local reader tools
  ansible.builtin.assert:
    that:
      - inventory_hostname == 'localhost'
      - ansible_connection == 'local'
      - hosting_platform in ['nsx', 'nutanix', 'neutron']
      - hosting_manifest_path | length > 0
    fail_msg: 'Use an exact local manifest and a supported read-only adapter.'

- name: Validate input without contacting any platform
  ansible.builtin.command:
    argv: >-
      {{ [ansible_playbook_python, '-m', 'provisioner.execution.' + hosting_platform + '_observe', hosting_manifest_path]
         + (['--validate-only'] if hosting_platform == 'neutron' else []) }}
    chdir: '{{ playbook_dir }}/../../..'
  register: hosting_readback_validation
  changed_when: false
  when: not ansible_check_mode

- name: Confirm the no-contact result
  ansible.builtin.assert:
    that:
      - (hosting_readback_validation.stdout | from_json).status == 'INPUT_VALID_NO_CONTACT'
      - not (hosting_readback_validation.stdout | from_json).target_contacted
      - not (hosting_readback_validation.stdout | from_json).may_activate
  when: not ansible_check_mode
