name: Disposable protocol and packet labs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-labs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install local test dependencies
        run: python -m pip install -r requirements-repository.txt
      - name: HTTPS readback and recovery fixtures
        run: python lab/run_readback_lab.py --execute
      - name: DNS transaction fixture
        run: python lab/run_dns_lab.py --execute
      - name: Fixed isolated network-namespace fixture
        run: python lab/run_namespace_lab.py --execute
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: disposable-lab-reports
          path: build/reports/
          retention-days: 14
          if-no-files-found: warn
