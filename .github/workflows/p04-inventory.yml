name: P04 inventory
on:
  push:
    branches: [greenfield/enterprise-microservices-plan]
    paths: ['services/inventory/**', 'workers/inventory/**', 'services/governance/**', 'apps/console/**', 'contracts/**', 'scripts/p04/**', '.github/workflows/p04-inventory.yml']
  pull_request:
    branches: [greenfield/enterprise-microservices-plan]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    name: P04 PostgreSQL inventory integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.19'
          enable-cache: false
      - name: Exercise persistence, revocation, fairness and restart over PostgreSQL TLS
        env:
          P04_POSTGRES_BIN: /usr/lib/postgresql/16/bin
        run: python scripts/p04/qualify.py --output "$RUNNER_TEMP/p04-inventory"
      - name: Retain exact-source results including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p04-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p04-inventory/
          if-no-files-found: error
          retention-days: 14

  live:
    name: P04 live discovery, Console and delivery (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      P04_BROWSER_ENGINE: ${{ matrix.browser }}
    services:
      postgres:
        image: postgres@sha256:9e73daeb439141c2b11eea2463f5f1a3b269fd90d897b41cddb7cb440f21aa5d
        env:
          POSTGRES_PASSWORD: synthetic-p04-disposable-postgres
          POSTGRES_DB: p04_live_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.11'
          extensions: ctype, curl, dom, fileinfo, mbstring, openssl, pdo, pdo_pgsql, pdo_sqlite, sockets, tokenizer, xml, xmlwriter
          coverage: none
          tools: composer:2.10.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.19'
          enable-cache: false
      - name: Install the three independent locked applications
        run: |
          for component in services/governance services/catalogue apps/console; do
            mkdir -p "$component/bootstrap/cache" "$component/storage/framework/"{cache,sessions,views} "$component/storage/logs"
            touch "$component/.env"
            composer install --working-dir="$component" --no-scripts --no-interaction --prefer-dist --no-progress
          done
          uv sync --project services/inventory --locked
          uv sync --project workers/inventory --locked
          npm ci --prefix apps/console --ignore-scripts --no-audit --no-fund
          npm run build --prefix apps/console
          cd apps/console
          npx playwright install --with-deps "${P04_BROWSER_ENGINE}"
      - name: Exercise PostgreSQL, native fixture pagination, live TLS authority, broker replay and compiled browser journeys
        env:
          P04_TEST_POSTGRES: '1'
          P04_ADMIN_PASSWORD: synthetic-p04-disposable-postgres
          P04_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: uv run --project scripts/p01/contracts --frozen python scripts/p04/verify_live.py --output "$RUNNER_TEMP/p04-live"
      - name: Retain redacted exact-source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p04-live-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p04-live/
          if-no-files-found: error
          retention-days: 14
