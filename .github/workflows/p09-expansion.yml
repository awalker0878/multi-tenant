name: P09 platform expansion conformance
on:
  push:
    branches: [main, greenfield/enterprise-microservices-plan, implementation/p09-expansion-20261007]
    paths: ['services/planning/**', 'services/lifecycle/**', 'workers/lifecycle/**', 'contracts/**', 'scripts/p09/**', '.github/workflows/p09-expansion.yml']
  pull_request:
    branches: [main, greenfield/enterprise-microservices-plan]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.19'
          enable-cache: false
      - name: Install repository validation dependencies
        run: python -m pip install --requirement requirements-docs.txt
      - name: Verify canonical capability definitions and implementation coverage
        run: |
          uv sync --frozen --project services/planning
          services/planning/.venv/bin/python scripts/generate_capabilities.py --check
          services/planning/.venv/bin/python -m unittest discover -s tests/contracts -p test_capabilities.py -v
      - name: Qualify directed matrix, adoption, enterprise budgets and signed native adapters
        env:
          P05_POSTGRES_BIN: /usr/lib/postgresql/16/bin
        run: python scripts/p09/qualify.py --output "$RUNNER_TEMP/p09-conformance"
      - name: Retain exact-source original observations, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p09-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p09-conformance/
          if-no-files-found: error
          retention-days: 14
