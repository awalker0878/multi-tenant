name: Finalize reviewed qualification owners
on:
  push:
    branches: ['implementation/all-waves']
    paths: ['.github/workflows/mobility-source-review.yml']
permissions:
  contents: write
concurrency:
  group: mobility-reviewed-patch-publication
  cancel-in-progress: false
jobs:
  reviewed-changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/implementation/all-waves'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify source and transform checksum
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, subprocess
          from pathlib import Path
          script=Path('.github/mobility-qualification-finalize.py')
          if hashlib.sha256(script.read_bytes()).hexdigest()!='d0b05833c368dd9807e5f45b40360a509fc8d5a90d4d4cb68178bc47c1634e42':
              raise SystemExit('Reviewed transform checksum mismatch')
          env=dict(os.environ,GIT_INDEX_FILE=str(Path(os.environ['RUNNER_TEMP'])/'input-index'))
          subprocess.run(['git','read-tree','HEAD'],env=env,check=True)
          transport=[str(script),'.github/workflows/mobility-source-review.yml']+[f'.github/mobility-review-core-{i}.b64' for i in range(5)]
          subprocess.run(['git','update-index','--force-remove',*transport],env=env,check=True)
          if subprocess.check_output(['git','write-tree'],env=env).decode().strip()!='3ff42c10ba18797abe6d5cdde7dc84e646ac2768':
              raise SystemExit('Concurrent source changes detected; publication refused')
          PY
      - name: Relocate reviewed qualification dependencies
        run: python .github/mobility-qualification-finalize.py
      - name: Install test dependencies
        run: python -m pip install -r requirements-repository.txt
      - name: Check architecture and qualification regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/provisioning/unit -p 'test_*.py'
          python -m unittest tests.test_version_source_provenance tests.test_qualification_campaign_assurance tests.test_target_selection_assurance tests.test_platform_qualification tests.test_platform_family_eligibility tests.test_capability_coverage
          python scripts/check_documentation.py
          python scripts/check_retired_interfaces.py
      - name: Verify output and publish by fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Repository review'
          git config user.email 'review@users.noreply.github.com'
          git add provisioner scripts docs sources tests
          git -c core.hooksPath=/dev/null commit -m 'fix(qualification): own the entire validation dependency chain without script backreach'
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          env=dict(os.environ,GIT_INDEX_FILE=str(Path(os.environ['RUNNER_TEMP'])/'output-index'))
          subprocess.run(['git','read-tree','HEAD'],env=env,check=True)
          transport=['.github/mobility-qualification-finalize.py','.github/workflows/mobility-source-review.yml']+[f'.github/mobility-review-core-{i}.b64' for i in range(5)]
          subprocess.run(['git','update-index','--force-remove',*transport],env=env,check=True)
          actual=subprocess.check_output(['git','write-tree'],env=env).decode().strip()
          if actual!='7384e64046a2293d4e5e64f86db1d01dacf681c5':
              raise SystemExit('Reviewed output tree mismatch: '+actual)
          print('Exact reviewed source tree verified:',actual)
          PY
          test -z "$(git status --porcelain --untracked-files=no)"
          git push origin HEAD:refs/heads/implementation/all-waves
