name: On-demand platform qualification
on:
  workflow_call:
    inputs:
      suite:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      suite:
        description: Explicit high-cost suite; never launched automatically by PR updates
        required: true
        type: choice
        options: [infrastructure, integration, native, browser, images, contract-artifacts, all]
        default: infrastructure
permissions:
  contents: read
concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  infrastructure:
    name: Qualified local platform, stateful and Kubernetes exercises
    if: inputs.suite == 'infrastructure' || inputs.suite == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.19'
      - run: |
          python3 scripts/p01/run_local.py --output "$RUNNER_TEMP/local" --source-revision "$GITHUB_SHA"
          python3 scripts/p01/run_stateful.py --output "$RUNNER_TEMP/stateful" --source-revision "$GITHUB_SHA"
          python3 scripts/p01/run_kubernetes.py --output "$RUNNER_TEMP/kubernetes" --source-revision "$GITHUB_SHA"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: infrastructure-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/local/
            ${{ runner.temp }}/stateful/
            ${{ runner.temp }}/kubernetes/
          if-no-files-found: warn
          retention-days: 14

  native:
    name: Qualification of provider adapters and operating envelope
    if: inputs.suite == 'native' || inputs.suite == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      P05_POSTGRES_BIN: /usr/lib/postgresql/16/bin
      P07_POSTGRES_BIN: /usr/lib/postgresql/16/bin
      P08_POSTGRES_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.19'
      - run: python -m pip install -r requirements-docs.txt
      - run: |
          python scripts/p07/qualify.py --output "$RUNNER_TEMP/p07-preparation"
          python scripts/p07/qualify_native.py --output "$RUNNER_TEMP/p07-adapters"
          python scripts/p07/qualify_dispatch.py --output "$RUNNER_TEMP/p07-dispatch"
          python scripts/p10/qualify.py --output "$RUNNER_TEMP/p10-qualification"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-qualification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/p07-*/
            ${{ runner.temp }}/p10-qualification/
          if-no-files-found: warn
          retention-days: 14

  browser:
    name: End-to-end native migration browser exercises
    if: inputs.suite == 'browser' || inputs.suite == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - run: |
          npm ci --prefix apps/console --ignore-scripts --no-audit --no-fund
          cd apps/console
          npx playwright install --with-deps --only-shell chromium
      - run: python scripts/p08/qualify_browser.py --output "$RUNNER_TEMP/browser"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/browser/
          if-no-files-found: warn
          retention-days: 14

  images:
    name: Source-pinned images (${{ matrix.component }})
    if: inputs.suite == 'images' || inputs.suite == 'all'
    strategy:
      fail-fast: false
      matrix:
        component: [governance, catalogue, assurance, inventory, planning, lifecycle, inventory-workers, lifecycle-workers, console]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - env:
          P01_COMPONENT: ${{ matrix.component }}
        run: |
          python3 scripts/p01/run_images.py --component "$P01_COMPONENT" --output "$RUNNER_TEMP/image" --source-revision "$GITHUB_SHA"
          python3 scripts/p01/artifacts/campaign.py --build-report "$RUNNER_TEMP/image/report.json" --output "$RUNNER_TEMP/artifact"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-${{ matrix.component }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/image/
            ${{ runner.temp }}/artifact/
          if-no-files-found: warn
          retention-days: 14

  artifact-bindings:
    if: inputs.suite == 'contract-artifacts' || inputs.suite == 'all'
    name: Built contract bindings (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {component: 'apps/console', name: console, python: false}
          - {component: 'services/catalogue', name: catalogue, python: false}
          - {component: 'services/governance', name: governance, python: false}
          - {component: 'services/assurance', name: assurance, python: false}
          - {component: 'services/inventory', name: inventory, python: true}
          - {component: 'services/planning', name: planning, python: true}
          - {component: 'services/lifecycle', name: lifecycle, python: true}
          - {component: 'workers/inventory', name: inventory-worker, python: true}
          - {component: 'workers/lifecycle', name: lifecycle-worker, python: true}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Install pinned contract validation dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/contracts/requirements.txt
      - name: Verify complete deployable component matrix
        run: python scripts/contracts/runtime_binding_coverage.py
      - name: Assert wheel and dependency negative canaries
        run: |
          python -m unittest discover -s tests/contracts -p 'test_phase2_artifacts.py' -v
      - name: Build the actual runtime image with exact source provenance
        env:
          COMPONENT: ${{ matrix.component }}
          TAG: contract-assurance/${{ matrix.name }}:${{ github.sha }}
        run: |
          set -euo pipefail
          # Retry only external registry DNS/network failures, not source defects.
          for attempt in 1 2 3; do
            if docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -t "$TAG" "$COMPONENT" 2>&1 | tee "$RUNNER_TEMP/contract-image-build.log"; then
              break
            fi
            if [[ "$attempt" -eq 3 ]] || ! grep -Eqi 'dial tcp|i/o timeout|temporary failure|TLS handshake timeout|502 Bad Gateway|503 Service Unavailable' "$RUNNER_TEMP/contract-image-build.log"; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
      - name: Verify packaged JSON and bind owned operations to image digest
        env:
          COMPONENT: ${{ matrix.component }}
          TAG: contract-assurance/${{ matrix.name }}:${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/contract-attestations"
          python scripts/contracts/artifact_attestation.py --component "$COMPONENT" --image-tag "$TAG" --output "$RUNNER_TEMP/contract-attestations/image-${{ matrix.name }}.json"
      - name: Build the Python wheel supplying the image
        if: matrix.python
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check setuptools==84.0.0 wheel==0.48.0
          mkdir -p "$RUNNER_TEMP/wheels"
          python -m pip wheel --no-deps --no-build-isolation -w "$RUNNER_TEMP/wheels" "$COMPONENT"
      - name: Verify actual wheel contents against canonical installed versions
        if: matrix.python
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          WHEEL=$(find "$RUNNER_TEMP/wheels" -maxdepth 1 -name '*.whl' -type f)
          [ "$(printf '%s\n' "$WHEEL" | wc -l)" -eq 1 ]
          python scripts/contracts/artifact_attestation.py --component "$COMPONENT" --wheel "$WHEEL" --output "$RUNNER_TEMP/contract-attestations/wheel-${{ matrix.name }}.json"
      - name: Retain measured image/wheel contract attestations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contract-artifacts-${{ matrix.name }}-${{ github.sha }}
          path: ${{ runner.temp }}/contract-attestations/*.json
          if-no-files-found: warn
          retention-days: 30

  aggregate-bindings:
    name: Complete source-pinned contract to runtime image binding
    if: (inputs.suite == 'contract-artifacts' || inputs.suite == 'all') && always()
    needs: [artifact-bindings]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Install pinned validators
        run: python -m pip install --disable-pip-version-check -r scripts/contracts/requirements.txt
      - name: Download image/wheel evidence created in this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: contract-artifacts-*-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-attestations
          merge-multiple: true
      - name: Validate every owned and shared canonical operation is bound to the exact image
        run: |
          python scripts/contracts/aggregate_artifacts.py --input-directory "$RUNNER_TEMP/runtime-attestations" --output "$RUNNER_TEMP/runtime-release-bindings.json"
      - name: Publish complete immutable runtime contract release bindings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-contract-release-bindings-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-release-bindings.json
          if-no-files-found: warn
          retention-days: 30

  p02-events-governance-events:
    if: inputs.suite == 'integration' || inputs.suite == 'all'
    name: Governance PostgreSQL and confirmed TLS event delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:9e73daeb439141c2b11eea2463f5f1a3b269fd90d897b41cddb7cb440f21aa5d
        env:
          POSTGRES_PASSWORD: synthetic-p02-disposable-postgres
          POSTGRES_DB: p02_identity_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.11'
          extensions: ctype, curl, dom, fileinfo, mbstring, openssl, pdo, pdo_pgsql, pdo_sqlite, sockets, tokenizer, xml, xmlwriter
          coverage: none
          tools: composer:2.10.3
      - name: Install Governance from its independent lock
        run: |
          mkdir -p services/governance/bootstrap/cache services/governance/storage/framework/{cache,sessions,views} services/governance/storage/logs
          touch services/governance/.env
          composer install --working-dir=services/governance --no-scripts --no-interaction --prefer-dist --no-progress
      - name: Exercise PostgreSQL concurrency, expiry and real TLS broker delivery
        env:
          P02_TEST_POSTGRES: '1'
          P02_TEST_PASSWORD: synthetic-p02-disposable-postgres
        run: python3 scripts/p02/verify_events.py --output "$RUNNER_TEMP/p02-governance-events"
      - name: Retain exact source and redacted observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p02-governance-events-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p02-governance-events/
          if-no-files-found: error
          retention-days: 14

  p02-identity-identity:
    if: inputs.suite == 'integration' || inputs.suite == 'all'
    name: P02 identity, tenancy, approval, support and notifications (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      P02_BROWSER_ENGINE: ${{ matrix.browser }}
    services:
      postgres:
        image: postgres@sha256:9e73daeb439141c2b11eea2463f5f1a3b269fd90d897b41cddb7cb440f21aa5d
        env:
          POSTGRES_PASSWORD: synthetic-p02-disposable-postgres
          POSTGRES_DB: p02_identity_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.11'
          extensions: ctype, curl, dom, fileinfo, mbstring, openssl, pdo, pdo_pgsql, pdo_sqlite, sockets, tokenizer, xml, xmlwriter
          coverage: none
          tools: composer:2.10.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.19'
          enable-cache: false
      - name: Install the two independent locked applications
        run: |
          for component in services/governance apps/console; do
            mkdir -p "$component/bootstrap/cache" "$component/storage/framework/"{cache,sessions,views} "$component/storage/logs"
            touch "$component/.env"
            composer install --working-dir="$component" --no-scripts --no-interaction --prefer-dist --no-progress
          done
          npm ci --prefix apps/console --ignore-scripts --no-audit --no-fund
          npm run build --prefix apps/console
          cd apps/console
          npx playwright install --with-deps "${P02_BROWSER_ENGINE}"
      - name: Exercise PostgreSQL, TLS notification delivery, deployment terminals and compiled browser journeys
        env:
          P02_TEST_POSTGRES: '1'
          P02_TEST_PASSWORD: synthetic-p02-disposable-postgres
          P02_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: uv run --project scripts/p01/contracts --frozen python scripts/p02/verify_identity.py --output "$RUNNER_TEMP/p02-identity"
      - name: Retain redacted exact-source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p02-identity-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p02-identity/
          if-no-files-found: error
          retention-days: 14

  p03-catalogue:
    if: inputs.suite == 'integration' || inputs.suite == 'all'
    name: P03 catalogue integrity and persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:9e73daeb439141c2b11eea2463f5f1a3b269fd90d897b41cddb7cb440f21aa5d
        env:
          POSTGRES_PASSWORD: synthetic-p03-disposable-postgres
          POSTGRES_DB: p03_catalogue_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.11'
          extensions: ctype, curl, dom, fileinfo, mbstring, openssl, pdo, pdo_pgsql, pdo_sqlite, sockets, tokenizer, xml, xmlwriter
          coverage: none
          tools: composer:2.10.3
      - name: Install the independent locked Catalogue and Governance packages
        run: |
          for component in services/catalogue services/governance; do
            mkdir -p "$component/bootstrap/cache" "$component/storage/framework/"{cache,sessions,views} "$component/storage/logs"
            touch "$component/.env"
            composer install --working-dir="$component" --no-scripts --no-interaction --prefer-dist --no-progress
          done
      - name: Exercise controlled migrations and PostgreSQL TLS persistence
        env:
          P03_TEST_POSTGRES: '1'
          P03_ADMIN_PASSWORD: synthetic-p03-disposable-postgres
          P03_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python scripts/p03/verify_catalogue.py --output "$RUNNER_TEMP/p03-catalogue"
      - name: Retain exact-source redacted results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p03-catalogue-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p03-catalogue/
          if-no-files-found: error
          retention-days: 14

  p03-live:
    if: inputs.suite == 'integration' || inputs.suite == 'all'
    name: P03 live authoring, concurrency and delivery (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      P03_BROWSER_ENGINE: ${{ matrix.browser }}
    services:
      postgres:
        image: postgres@sha256:9e73daeb439141c2b11eea2463f5f1a3b269fd90d897b41cddb7cb440f21aa5d
        env:
          POSTGRES_PASSWORD: synthetic-p03-disposable-postgres
          POSTGRES_DB: p03_live_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.11'
          extensions: ctype, curl, dom, fileinfo, mbstring, openssl, pdo, pdo_pgsql, pdo_sqlite, sockets, tokenizer, xml, xmlwriter
          coverage: none
          tools: composer:2.10.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.19'
          enable-cache: false
      - name: Install the three independent locked applications
        run: |
          for component in services/governance services/catalogue apps/console; do
            mkdir -p "$component/bootstrap/cache" "$component/storage/framework/"{cache,sessions,views} "$component/storage/logs"
            touch "$component/.env"
            composer install --working-dir="$component" --no-scripts --no-interaction --prefer-dist --no-progress
          done
          npm ci --prefix apps/console --ignore-scripts --no-audit --no-fund
          npm run build --prefix apps/console
          cd apps/console
          npx playwright install --with-deps "${P03_BROWSER_ENGINE}"
      - name: Exercise PostgreSQL, live TLS service authorization, broker replay and compiled browser journeys
        env:
          P03_TEST_POSTGRES: '1'
          P03_ADMIN_PASSWORD: synthetic-p03-disposable-postgres
          P03_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: uv run --project scripts/p01/contracts --frozen python scripts/p03/verify_live.py --output "$RUNNER_TEMP/p03-live"
      - name: Retain redacted exact-source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p03-live-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p03-live/
          if-no-files-found: error
          retention-days: 14

  p04-inventory:
    if: inputs.suite == 'integration' || inputs.suite == 'all'
    name: P04 PostgreSQL inventory integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.19'
          enable-cache: false
      - name: Import and compile all Inventory and collector Python before database startup
        run: |
          python -m compileall -q services/inventory/src workers/inventory/src
          PYTHONPATH=services/inventory/src uv run --project services/inventory --frozen python -c "import inventory.application.profile_collection; import inventory.application.discovery; import inventory.application.migration_collection_ledger"
      - name: Exercise persistence, revocation, fairness and restart over PostgreSQL TLS
        env:
          P04_POSTGRES_BIN: /usr/lib/postgresql/16/bin
        run: python scripts/p04/qualify.py --output "$RUNNER_TEMP/p04-inventory"
      - name: Retain exact-source results including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p04-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p04-inventory/
          if-no-files-found: error
          retention-days: 14

  p04-live:
    if: inputs.suite == 'integration' || inputs.suite == 'all'
    name: P04 live discovery, Console and delivery (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      P04_BROWSER_ENGINE: ${{ matrix.browser }}
    services:
      postgres:
        image: postgres@sha256:9e73daeb439141c2b11eea2463f5f1a3b269fd90d897b41cddb7cb440f21aa5d
        env:
          POSTGRES_PASSWORD: synthetic-p04-disposable-postgres
