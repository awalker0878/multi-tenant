apiVersion: hosting.platform/v1
kind: WorkloadSecurityDomain
metadata:
  tenant: tenant-01
  name: wsd-dev-01
  owner: platform-team
  description: Internal development workload security domain for tenant-01.
spec:
  environment: development
  security:
    profile: internal-baseline
  assurance:
    profile: standard
  platform:
    preference: auto
  placement:
    region: east
    site: null
    cell: null
  availability:
    profile: single-zone
  network:
    profile: internal-ipv4
  recovery:
    enabled: false
  capacity:
    computeProfile: small
    storageProfile: standard
  zones:
    operations:
      enabled: true
    restricted:
      enabled: false
  services:
    dns: default
    ntp: default
    identity: enterprise
    logging: protected-b
    backup: standard
  exposure:
    publicIngress: false
    internetEgress: false