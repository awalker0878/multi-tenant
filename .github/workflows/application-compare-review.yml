name: Publish reviewed application comparison
on:
  push:
    branches: ['implementation/all-waves']
    paths: ['.github/workflows/application-compare-review.yml']
permissions:
  contents: write
concurrency:
  group: reviewed-application-comparison-publication
  cancel-in-progress: false
jobs:
  reviewed-comparison:
    if: github.repository == 'awalker0878/multi-tenant' && github.event_name == 'push' && github.ref == 'refs/heads/implementation/all-waves'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify baseline and apply the reviewed commit series
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Repository review'
          git config user.email 'review@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, os, subprocess
          baseline='e3858f75922a62996e5d6584db63e54925d9bfc6'
          parts=[f'.github/application-compare-reviewed-{i}.b64' for i in range(3)]
          allowed=set(parts+['.github/workflows/application-compare-review.yml'])
          subprocess.run(['git','merge-base','--is-ancestor',baseline,'HEAD'],check=True)
          changed=set(subprocess.check_output(['git','diff','--name-only','-z',baseline,'HEAD']).decode().strip('\0').split('\0'))
          if changed-allowed:
              raise SystemExit('Concurrent source changes; publication refused')
          encoded=''.join(Path(part).read_text().strip() for part in parts)
          if len(encoded)!=31164:
              raise SystemExit('Reviewed patch transport size mismatch')
          packed=base64.b64decode(encoded,validate=True)
          if hashlib.sha256(packed).hexdigest()!='06c9ff8d67cc19c64e2cd131aac7f4710a7f67c06b2abcc55ec769044eea8d2b':
              raise SystemExit('Reviewed transport checksum mismatch')
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch=decoder.decompress(packed,max_length=1024*1024)
          if not decoder.eof or decoder.unused_data or len(patch)!=104076:
              raise SystemExit('Unexpected decompressed patch')
          if hashlib.sha256(patch).hexdigest()!='e84866d098583ab10a4cd11cbbbbd01cc862335bc13f28a3cf78359ae3285cfe':
              raise SystemExit('Reviewed implementation checksum mismatch')
          path=Path(os.environ['RUNNER_TEMP'])/'reviewed-application-comparison.patch'
          path.write_bytes(patch)
          subprocess.run(['git','am',str(path)],check=True)
          PY
      - name: Verify and isolate the exact transport-free delivery tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          env=dict(os.environ,GIT_INDEX_FILE=str(Path(os.environ['RUNNER_TEMP'])/'delivery-index'))
          subprocess.run(['git','read-tree','HEAD'],env=env,check=True)
          transport=[f'.github/application-compare-reviewed-{i}.b64' for i in range(3)]+['.github/workflows/application-compare-review.yml']
          subprocess.run(['git','update-index','--force-remove',*transport],env=env,check=True)
          actual=subprocess.check_output(['git','write-tree'],env=env).decode().strip()
          if actual!='ab27cb70cd649c5d26e31294502a5e72a814fbcc':
              raise SystemExit('Reviewed source tree mismatch: '+actual)
          candidate=subprocess.check_output(['git','commit-tree',actual,'-p','HEAD','-m','Temporary exact-tree validation candidate']).decode().strip()
          destination=str(Path(os.environ['RUNNER_TEMP'])/'comparison-delivery')
          subprocess.run(['git','worktree','add','--detach',destination,candidate],check=True)
          print('Exact reviewed source tree verified:',actual)
          PY
      - name: Install repository test and package dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/comparison-delivery"
          python -m pip install -r requirements-repository.txt -e '.[controlplane]' 'setuptools>=80,<85' 'wheel>=0.45,<1'
      - name: Test the reviewed deliverable
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/comparison-delivery"
          python -m unittest tests.provisioning.discovery.test_application_assessment tests.provisioning.discovery.test_service tests.provisioning.discovery.test_application_review tests.provisioning.api.test_application_assessment_http tests.provisioning.api.test_assessment_http tests.provisioning.api.test_application_reviews_http
          python -m unittest tests.provisioning.unit.test_architecture tests.provisioning.api.test_application_review_cli
          python scripts/check_documentation.py
          python scripts/check_repository.py
          python scripts/check_retired_interfaces.py
          python scripts/check_installed_distribution.py
      - name: Publish only by ordinary fast-forward
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          git push origin HEAD:refs/heads/implementation/all-waves
          git log -3 --format='%h %s'
