name: Mobility source snapshot
on:
  push:
    branches: [implementation/mobility-integrity-closure]
    paths: [.github/workflows/mobility-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Export tracked source only
        run: |
          mkdir -p "$RUNNER_TEMP/mobility-source"
          git archive --format=tar HEAD > "$RUNNER_TEMP/mobility-source/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/mobility-source/commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobility-tracked-source
          path: ${{ runner.temp }}/mobility-source/
          retention-days: 1
          if-no-files-found: error
