apiVersion: hosting.platform/v1
kind: WorkloadSecurityDomain
metadata:
  tenant: tenant-01
  name: wsd-archive-01
  owner: data-platform-team
  description: Storage-heavy archive workload security domain for tenant-01.
spec:
  environment: production
  security:
    profile: protected-b-medium
  assurance:
    profile: standard
  platform:
    preference: auto
  placement:
    region: east
    site: null
    cell: null
  availability:
    profile: high
  network:
    profile: internal-ipv4
  recovery:
    enabled: true
    profile: standard
  capacity:
    computeProfile: small
    storageProfile: high-capacity
  zones:
    operations:
      enabled: true
    restricted:
      enabled: true
  services:
    dns: default
    ntp: default
    identity: enterprise
    logging: protected-b
    backup: standard
  exposure:
    publicIngress: false
    internetEgress: false